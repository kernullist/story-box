        showCount: 0,
        playCount: 0,
        expedCount: 0,
        specialCount: 0,
        dexDone: false,
        tutorialDone: false
    };
}

// runtime-only feeding event state (aquarium feature)
var FEED = null;
var feedCd = 18;
// runtime-only show state (aquarium stage)
var SHOW = null;

function newGame()
{
    S = defaultState();
    VISITORS = [];
    FLOATS = [];
    EMOTES = [];
    objIdSeq = 1;
    // starter layout: one small enclosure with the starter species
    var o = { id: objIdSeq++, type: 'small', x: 4, y: 6, species: THEME.starter, lv: 1, mood: 80 };
    S.objects.push(o);
    FEED = null;
    feedCd = 18;
    SHOW = null;
    rebuildGrid();
}

function saveGame(silent)
{
    try
    {
        S.saveTime = Date.now();
        localStorage.setItem(THEME.saveKey, JSON.stringify(S));
        if (!silent)
        {
            showToast('저장 완료!');
        }
        return true;
    }
    catch (e)
    {
        showToast('저장에 실패했습니다');
        return false;
    }
}

function hasSave()
{
    try
    {
        return !!localStorage.getItem(THEME.saveKey);
    }
    catch (e)
    {
        return false;
    }
}

function loadGame()
{
    try
    {
        var raw = localStorage.getItem(THEME.saveKey);
        if (!raw)
        {
            return false;
        }
        var d = JSON.parse(raw);
        S = defaultState();
        for (var k in d)
        {
            S[k] = d[k];
        }
        if (d.opened === undefined)
        {
            // saves from before the opening system are already open
            S.opened = true;
        }
        if (d.bgmOn === undefined)
        {
            S.bgmOn = true;
        }
        if (!S.floorTiles)
        {
            S.floorTiles = {};
        }
        if (!S.buffs)
        {
            S.buffs = {};
        }
        if (d.jobsAnnounced === undefined)
        {
            // pre-update saves: silently mark already-unlocked jobs as known
            S.jobsAnnounced = [];
            for (var vt = 0; vt < VTYPES.length; vt++)
            {
                if (S.fame >= (VTYPES[vt].unlockFame || 0))
                {
                    S.jobsAnnounced.push(VTYPES[vt].id);
                }
            }
        }
        VISITORS = [];
        FLOATS = [];
        EMOTES = [];
        FEED = null;
        feedCd = 18;
        SHOW = null;
        var maxId = 0;
        for (var i = 0; i < S.objects.length; i++)
        {
            if (S.objects[i].id > maxId)
            {
                maxId = S.objects[i].id;
            }
        }
        objIdSeq = maxId + 1;
        rebuildGrid();
        return true;
    }
    catch (e)
    {
        return false;
    }
}

// ---------- grid / placement ----------
var walkGrid = null; // 2d array true=walkable

function usableW()
{
    return EXP_W[S.expansion];
}

// ---------- permanent buffs (request rewards) ----------
// buffs stack: level N gives N * step
function buffLv(id)
{
    return (S.buffs && S.buffs[id]) ? S.buffs[id] : 0;
}

// multiplier form: 1 + level * step
function buffMul(id)
{
    return 1 + buffLv(id) * (BUFFS[id] ? BUFFS[id].step : 0);
}

// additive form: level * step
function buffAdd(id)
{
    return buffLv(id) * (BUFFS[id] ? BUFFS[id].step : 0);
}

// ---------- floor tiles ----------
function floorKey(x, y)
{
    return x + ',' + y;
}

function floorAt(x, y)
{
    var id = S.floorTiles ? S.floorTiles[floorKey(x, y)] : null;
    return id ? FLOORS[id] : null;
}

// a floor tile can be painted on any in-bounds walkable tile
function canPaintFloor(x, y)
{
    if (x < 0 || y < 0 || x >= usableW() || y >= MAP_H)
    {
        return false;
    }
    if (objectAt(x, y))
    {
        return false;
    }
    if (x === ENTRANCE.x && (y === ENTRANCE.y || y === ENTRANCE.y - 1))
    {
        return false;
    }
    return true;
}

function paintFloor(x, y, id)
{
    if (!canPaintFloor(x, y))
    {
        return false;
    }
    var key = floorKey(x, y);
    if (id === 'erase')
    {
        if (!S.floorTiles[key])
        {
            return false;
        }
        delete S.floorTiles[key];
        return true;
    }
    if (S.floorTiles[key] === id)
    {
        return false;
    }
    var f = FLOORS[id];
    if (S.money < f.cost)
    {
        return false;
    }
    S.money -= f.cost;
    S.floorTiles[key] = id;
    return true;
}

function floorMaintTotal()
{
    var sum = 0;
    for (var k in S.floorTiles)
    {
        var f = FLOORS[S.floorTiles[k]];
        if (f)
        {
            sum += f.maint;
        }
    }
    return sum;
}

// effective footprint in tiles (width/height swap when rotated 90 degrees)
function ftW(type, rot)
{
    var b = BUILD[type];
    return rot ? b.h : b.w;
}

function ftH(type, rot)
{
    var b = BUILD[type];
    return rot ? b.w : b.h;
}

function oW(o)
{
    return ftW(o.type, o.rot);
}

function oH(o)
{
    return ftH(o.type, o.rot);
}

// square footprints gain nothing from rotation
function canRotate(type)
{
    var b = BUILD[type];
    return b.w !== b.h;
}

function rebuildGrid()
{
    walkGrid = [];
    for (var y = 0; y < MAP_H; y++)
    {
        var row = [];
        for (var x = 0; x < MAP_W; x++)
        {
            row.push(x < usableW());
        }
        walkGrid.push(row);
    }
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        var ow = oW(o);
        var oh = oH(o);
        for (var dy = 0; dy < oh; dy++)
        {
            for (var dx = 0; dx < ow; dx++)
            {
                walkGrid[o.y + dy][o.x + dx] = false;
            }
        }
    }
}

function isWalkable(x, y)
{
    if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H)
    {
        return false;
    }
    return walkGrid[y][x];
}

function objectAt(x, y)
{
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        if (x >= o.x && x < o.x + oW(o) && y >= o.y && y < o.y + oH(o))
        {
            return o;
        }
    }
    return null;
}

// check placement validity. returns null if ok, or error message
function placeError(type, x, y, rot)
{
    var fw = ftW(type, rot);
    var fh = ftH(type, rot);
    if (x < 0 || y < 0 || x + fw > usableW() || y + fh > MAP_H)
    {
        return '부지 밖에는 지을 수 없습니다';
    }
    for (var dy = 0; dy < fh; dy++)
    {
        for (var dx = 0; dx < fw; dx++)
        {
            var tx = x + dx;
            var ty = y + dy;
            if (objectAt(tx, ty))
            {
                return '이미 다른 시설이 있습니다';
            }
            if ((tx === ENTRANCE.x && ty === ENTRANCE.y) || (tx === ENTRANCE.x && ty === ENTRANCE.y - 1))
            {
                return '입구를 막을 수 없습니다';
            }
        }
    }
    // simulate placement and check reachability of all objects
    var blocked = {};
    for (var dy2 = 0; dy2 < fh; dy2++)
    {
        for (var dx2 = 0; dx2 < fw; dx2++)
        {
            blocked[(x + dx2) + ',' + (y + dy2)] = true;
        }
    }
    var reach = bfsRegion(ENTRANCE.x, ENTRANCE.y, blocked);
    if (!reach)
    {
        return '입구를 막을 수 없습니다';
    }
    var all = S.objects.slice();
    all.push({ type: type, x: x, y: y, rot: rot });
    for (var i = 0; i < all.length; i++)
    {
        if (!objectReachable(all[i], reach, blocked))
        {
            return '통로가 막혀 관람객이 갈 수 없게 됩니다';
        }
    }
    return null;
}

function bfsRegion(sx, sy, extraBlocked)
{
    if (!isWalkable(sx, sy) || extraBlocked[sx + ',' + sy])
    {
        return null;
    }
    var seen = {};
    var q = [[sx, sy]];
    seen[sx + ',' + sy] = true;
    while (q.length > 0)
    {
        var cur = q.shift();
        var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (var d = 0; d < 4; d++)
        {
            var nx = cur[0] + dirs[d][0];
            var ny = cur[1] + dirs[d][1];
            var key = nx + ',' + ny;
            if (seen[key] || !isWalkable(nx, ny) || extraBlocked[key])
            {
                continue;
            }
            seen[key] = true;
            q.push([nx, ny]);
        }
    }
    return seen;
}

function objectReachable(o, reach, extraBlocked)
{
    var ow = oW(o);
    var oh = oH(o);
    for (var dy = 0; dy < oh; dy++)
    {
        for (var dx = 0; dx < ow; dx++)
        {
            var pts = [[o.x + dx + 1, o.y + dy], [o.x + dx - 1, o.y + dy], [o.x + dx, o.y + dy + 1], [o.x + dx, o.y + dy - 1]];
            for (var p = 0; p < 4; p++)
            {
                if (reach[pts[p][0] + ',' + pts[p][1]])
                {
                    return true;
                }
            }
        }
    }
    return false;
}

function placeObject(type, x, y, rot)
{
    rot = !!rot && canRotate(type);
    var err = placeError(type, x, y, rot);
    if (err)
    {
        showToast(err);
        sfx('bad');
        return null;
    }
    var b = BUILD[type];
    if (b.reqLock && S.facUnlocked.indexOf(type) < 0)
    {
        showToast('의뢰 게시판 보상으로 해금되는 건물입니다');
        sfx('bad');
        return null;
    }
    if (S.money < b.cost)
    {
        showToast('자금이 부족합니다');
        sfx('bad');
        return null;
    }
    S.money -= b.cost;
    var o = { id: objIdSeq++, type: type, x: x, y: y, lv: 1, rot: rot };
    if (b.kind === 'tank')
    {
        o.species = null;
    }
    S.objects.push(o);
    rebuildGrid();
    repathAll();
    addDust(o);
    addFloat((x + ftW(type, rot) / 2) * TS, y * TS, '-' + b.cost + 'G', '#ffb0a0');
    sfx('place');
    checkCombos();
    return o;
}

// commit a move-in-progress to (x,y) with rotation rot; the object was
// already lifted out of S.objects by startMove()
function commitMove(x, y, rot)
{
    rot = !!rot && canRotate(MODE.build);
    var err = placeError(MODE.build, x, y, rot);
    if (err)
    {
        showToast(err);
        sfx('bad');
        return false;
    }
    var o = MODE.moveObj;
    o.x = x;
    o.y = y;
    o.rot = rot;
    S.objects.push(o);
    rebuildGrid();
    repathAll();
    addDust(o);
    sfx('place');
    checkCombos();
    return true;
}

function sellObject(o)
{
    var b = BUILD[o.type];
    var refund = Math.floor(b.cost / 2);
    var idx = S.objects.indexOf(o);
    if (idx < 0)
    {
        return;
    }
    addDust(o);
    S.objects.splice(idx, 1);
    S.money += refund;
    rebuildGrid();
    repathAll();
    addFloat((o.x + oW(o) / 2) * TS, o.y * TS, '+' + refund + 'G', '#ffe060');
    sfx('sell');
}

function stockTank(o, spId)
{
    var sp = SPECIES[spId];
    var b = BUILD[o.type];
    var fits = b.touch ? (sp.touchOK && sp.cls <= b.cls) : (sp.cls <= b.cls);
    if (!fits)
    {
        showToast('여기에는 배치할 수 없습니다');
        return false;
    }
    if (S.money < sp.stock)
    {
        showToast('자금이 부족합니다');
        return false;
    }
    S.money -= sp.stock;
    o.species = spId;
    o.mood = 80;
    addFloat((o.x + 0.5) * TS, o.y * TS, sp.name + ' ' + THEME.text.stockFloat, '#a0e8ff');
    sfx('place');
    checkCombos();
    return true;
}

// itemized appeal calculation, so the UI can explain the exact numbers
function tankAppealParts(o)
{
    var b = BUILD[o.type];
    var parts = {
        base: b.base, sp: 0, spLv: 1, aura: 0, auraCapped: false,
        comboMult: 1 + S.combosDone.length * 0.06,
        moodMult: 1, compatMult: 1, specialMult: 1, buffMult: 1, total: 1
    };
    if (!o.species)
    {
        return parts;
    }
    var sp = SPECIES[o.species];
    var lv = S.spLv[o.species] || 1;
    parts.spLv = lv;
    parts.sp = sp.pop * (1 + 0.25 * (lv - 1));
    // aura from decorations within 2 tiles (capped at +8)
    var aura = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        var f = S.objects[i];
        var fb = BUILD[f.type];
        if (!fb.aura)
        {
            continue;
        }
        var dist = Math.max(Math.abs(f.x - o.x), Math.abs(f.y - o.y));
        if (dist <= 2)
        {
            aura += fb.aura;
        }
    }
    parts.auraCapped = aura > 8;
    parts.aura = Math.min(aura, 8);
    // cat cafe: mood and neighbor compatibility affect appeal
    if (THEME.feature === 'mood')
    {
        var mood = (o.mood === undefined) ? 80 : o.mood;
        parts.moodMult = 0.5 + mood / 160;
        parts.compatMult = catCompatMult(o);
    }
    // museum: active special exhibition boosts member artifacts
    if (THEME.feature === 'expedition' && S.specialEx)
    {
        var plan = getSpecialPlan(S.specialEx.id);
        if (plan && plan.members.indexOf(o.species) >= 0)
        {
            parts.specialMult = 1.5;
        }
    }
    parts.buffMult = buffMul('appeal');
    parts.total = (parts.base + parts.sp + parts.aura) * parts.comboMult * parts.moodMult * parts.compatMult * parts.specialMult * parts.buffMult;
    return parts;
}

function tankAppeal(o)
{
    return tankAppealParts(o).total;
}

// neighbor cat zones within distance 2, excluding self
function catNeighbors(o)
{
    var out = [];
    for (var i = 0; i < S.objects.length; i++)
    {
        var n = S.objects[i];
        if (n === o || BUILD[n.type].kind !== 'tank' || !n.species)
        {
            continue;
        }
        var dist = Math.max(Math.abs(n.x - o.x), Math.abs(n.y - o.y));
        if (dist <= 2)
        {
            out.push(n);
        }
    }
    return out;
}

function catCompatMult(o)
{
    if (!o.species)
    {
        return 1;
    }
    var pers = SPECIES[o.species].pers;
    var ns = catNeighbors(o);
    var mult = 1;
    for (var i = 0; i < ns.length; i++)
    {
        var rel = persRelation(pers, SPECIES[ns[i].species].pers);
        mult += rel * 0.08;
    }
    if (mult < 0.75)
    {
        mult = 0.75;
    }
    if (mult > 1.25)
    {
        mult = 1.25;
    }
    return mult;
}

// ---------- pathfinding ----------
// dirOrder: optional per-visitor direction preference so different
// visitors take different corridors between the same two points
function findPath(sx, sy, tx, ty, dirOrder)
{
    if (sx === tx && sy === ty)
    {
        return [];
    }
    var prev = {};
    var seen = {};
    var q = [[sx, sy]];
    seen[sx + ',' + sy] = true;
    var found = false;
    var dirs = dirOrder || [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (q.length > 0 && !found)
    {
        var cur = q.shift();
        for (var d = 0; d < 4; d++)
        {
            var nx = cur[0] + dirs[d][0];
            var ny = cur[1] + dirs[d][1];
            var key = nx + ',' + ny;
            if (seen[key] || !isWalkable(nx, ny))
            {
                continue;
            }
            seen[key] = true;
            prev[key] = cur;
            if (nx === tx && ny === ty)
            {
                found = true;
                break;
            }
            q.push([nx, ny]);
        }
    }
    if (!found)
    {
        return null;
    }
    var path = [[tx, ty]];
    var k = tx + ',' + ty;
    while (prev[k])
    {
        var p = prev[k];
        if (p[0] === sx && p[1] === sy)
        {
            break;
        }
        path.unshift(p);
        k = p[0] + ',' + p[1];
    }
    return path;
}

// standable tiles adjacent to an object
function standTiles(o)
{
    var ow = oW(o);
    var oh = oH(o);
    var out = [];
    for (var dy = 0; dy < oh; dy++)
    {
        for (var dx = 0; dx < ow; dx++)
        {
            var pts = [[o.x + dx + 1, o.y + dy], [o.x + dx - 1, o.y + dy], [o.x + dx, o.y + dy + 1], [o.x + dx, o.y + dy - 1]];
            for (var p = 0; p < 4; p++)
            {
                if (isWalkable(pts[p][0], pts[p][1]))
                {
                    out.push({ x: pts[p][0], y: pts[p][1] });
                }
            }
        }
    }
    return out;
}

function repathAll()
{
    for (var i = 0; i < VISITORS.length; i++)
    {
        VISITORS[i].path = null;
        VISITORS[i].state = 'decide';
    }
}

// ---------- combos ----------
function objMatchesReq(o, req)
{
    var b = BUILD[o.type];
    if (req.type)
    {
        return o.type === req.type;
    }
    if (req.species)
    {
        return b.kind === 'tank' && o.species === req.species;
    }
    if (req.cls)
    {
        return b.kind === 'tank' && b.cls >= req.cls && !!o.species;
    }
    return false;
}

function checkCombos()
{
    for (var c = 0; c < COMBOS.length; c++)
    {
        var combo = COMBOS[c];
        if (S.combosDone.indexOf(combo.id) >= 0)
        {
            continue;
        }
        var anchors = S.objects.filter(function (o) { return objMatchesReq(o, combo.req[0]); });
        for (var a = 0; a < anchors.length; a++)
        {
            var anchor = anchors[a];
            var used = [anchor];
            var ok = true;
            for (var r = 1; r < combo.req.length; r++)
            {
                var req = combo.req[r];
                var found = null;
                for (var i = 0; i < S.objects.length; i++)
                {
                    var o = S.objects[i];
                    if (used.indexOf(o) >= 0 || !objMatchesReq(o, req))
                    {
                        continue;
                    }
                    var dist = Math.max(Math.abs(o.x - anchor.x), Math.abs(o.y - anchor.y));
                    if (dist <= COMBO_RANGE)
                    {
                        found = o;
                        break;
                    }
                }
                if (!found)
                {
                    ok = false;
                    break;
                }
                used.push(found);
            }
            if (ok)
            {
                S.combosDone.push(combo.id);
                S.fame += combo.fame;
                for (var u = 0; u < used.length; u++)
                {
                    addEmote((used[u].x + 0.5) * TS, used[u].y * TS, 'sparkle');
                }
                sfx('combo');
                queueModal({
                    title: '✨ 스폿 발견! ✨',
                    body: '<div style="text-align:center;font-size:18px;color:#c07000;">「' + combo.name + '」</div>' +
                        '<div style="text-align:center;margin-top:8px;">시설의 조합으로 특별한 명소가 탄생했습니다!<br>인기 +' + combo.fame + '<br><span class="small">발견한 스폿마다 전시의 매력이 조금씩 오릅니다</span></div>',
                    buttons: [{ label: '좋았어!', cls: '' }]
                });
                break;
            }
        }
    }
}

// fame gain with diminishing returns at high fame
function gainFame(n)
{
    var chance = 70 / (70 + S.fame);
    if (chance < 0.12)
    {
        chance = 0.12;
    }
    if (Math.random() < chance)
    {
        S.fame += n;
    }
}

// ---------- floats / emotes ----------
function addFloat(x, y, text, color)
{
    FLOATS.push({ x: x, y: y, text: text, color: color || '#ffffff', t: 0 });
    if (FLOATS.length > 40)
    {
        FLOATS.shift();
    }
}

function addEmote(x, y, kind)
{
    EMOTES.push({ x: x, y: y, kind: kind, t: 0 });
    if (EMOTES.length > 40)
    {
        EMOTES.shift();
    }
}

// construction dust puffs
var PUFFS = [];

function addDust(o)
{
    var ow = oW(o);
    var oh = oH(o);
    var n = 5 + ow * 2;
    for (var i = 0; i < n; i++)
    {
        PUFFS.push({
            x: o.x * TS + 4 + Math.random() * (ow * TS - 8),
            y: o.y * TS + oh * TS - 4 - Math.random() * 10,
            r: 2 + Math.random() * 3,
            vx: (Math.random() - 0.5) * 20,
            t: 0
        });
    }
    if (PUFFS.length > 60)
    {
        PUFFS.splice(0, PUFFS.length - 60);
    }
}

// ---------- visitors ----------
// concurrent visitor cap grows with fame and grade
function maxVisitorsNow()
{
    var m = 11 + Math.floor(S.fame / 16) + S.level * 3 + buffAdd('cap');
    if (m > MAX_VISITORS + buffAdd('cap'))
    {
        m = MAX_VISITORS + buffAdd('cap');
    }
    // a group visit needs room to actually pack the place out, otherwise
    // the crowd is blocked by the normal ceiling and nothing happens
    if (S.groupBurst > 0)
    {
        m += BURST_BONUS;
        if (m > MAX_VISITORS_BURST)
        {
            m = MAX_VISITORS_BURST;
        }
    }
    return m;
}

function shuffledDirs()
{
    var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = dirs.length - 1; i > 0; i--)
    {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = dirs[i];
        dirs[i] = dirs[j];
        dirs[j] = tmp;
    }
    return dirs;
}

function spawnVisitor()
{
    if (VISITORS.length >= maxVisitorsNow())
    {
        return;
    }
    // only job types unlocked by current fame visit
    var pool = VTYPES.filter(function (t)
    {
        if (S.fame < (t.unlockFame || 0))
        {
            return false;
        }
        return !t.rare || Math.random() < 0.25;
    });
    if (pool.length === 0)
    {
        return;
    }
    var vt = pool[Math.floor(Math.random() * pool.length)];
    var money = vt.money[0] + Math.floor(Math.random() * (vt.money[1] - vt.money[0]));
    if (money < S.fee)
    {
        money = S.fee + 100;
    }
    var v = {
        vt: vt,
        x: (ENTRANCE.x + 0.5) * TS,
        y: (ENTRANCE.y + 0.5) * TS + 10,
        dir: 'up',
        moving: false,
        animFrame: 0,
        animT: 0,
        state: 'decide',
        stateT: 0,
        path: null,
        target: null,
        needs: { hunger: 30 + Math.random() * 30, thirst: 28 + Math.random() * 30, toilet: 12 + Math.random() * 25, energy: 12 + Math.random() * 25 },
        penalized: {},
        dirs: shuffledDirs(),
        strolls: 0,
        idleDur: 0,
        sat: 45,
        money: money - S.fee,
        viewed: [],
        quota: 3 + Math.floor(Math.random() * 4) + (vt.quotaBonus || 0),
        giftDone: false,
        photoDone: false
    };
    VISITORS.push(v);
    S.money += S.fee;
    S.mon.feeIn += S.fee;
    S.mon.vis++;
    S.visTotal++;
    if (S.specialEx)
    {
        S.specialEx.vis++;
    }
    if (S.fee > 0)
    {
        addFloat(v.x, v.y - 10, '+' + S.fee + 'G', '#ffe060');
    }
}

function needDecayRates()
{
    return { hunger: 100 / 75, thirst: 100 / 60, toilet: 100 / 90, energy: 100 / 110 };
}

function facilityForNeed(need)
{
    var best = null;
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        var b = BUILD[o.type];
        if (b.need === need || (need === 'energy' && b.rest))
        {
            if (standTiles(o).length > 0)
            {
                best = o;
                if (Math.random() < 0.5)
                {
                    break;
                }
            }
        }
    }
    return best;
}

function pickTank(v)
{
    var cands = [];
    var total = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        var b = BUILD[o.type];
        if (b.kind !== 'tank' || !o.species || v.viewed.indexOf(o.id) >= 0)
        {
            continue;
        }
        if (standTiles(o).length === 0)
        {
            continue;
        }
        var w = tankAppeal(o);
        cands.push({ o: o, w: w });
        total += w;
    }
    if (cands.length === 0)
    {
        return null;
    }
    var r = Math.random() * total;
    for (var c = 0; c < cands.length; c++)
    {
        r -= cands[c].w;
        if (r <= 0)
        {
            return cands[c].o;
        }
    }
    return cands[cands.length - 1].o;
}

function goToObject(v, o, nextState)
{
    var tiles = standTiles(o);
    if (tiles.length === 0)
    {
        return false;
    }
    var vt = { x: Math.floor(v.x / TS), y: Math.floor(v.y / TS) };
    // choose nearest stand tile
    tiles.sort(function (a, b2)
    {
        var da = Math.abs(a.x - vt.x) + Math.abs(a.y - vt.y);
        var db = Math.abs(b2.x - vt.x) + Math.abs(b2.y - vt.y);
        return da - db;
    });
    for (var i = 0; i < tiles.length; i++)
    {
        var path = findPath(vt.x, vt.y, tiles[i].x, tiles[i].y, v.dirs);
        if (path !== null)
        {
            v.path = path;
            v.target = { objId: o.id, after: nextState };
            v.state = 'walk';
            return true;
        }
    }
    return false;
}

// stroll to a random open tile, then look around
function goToRandomTile(v)
{
    var vt = { x: Math.floor(v.x / TS), y: Math.floor(v.y / TS) };
    for (var tries = 0; tries < 8; tries++)
    {
        var tx = Math.floor(Math.random() * usableW());
        var ty = Math.floor(Math.random() * (MAP_H - 1));
        if (!isWalkable(tx, ty) || (tx === vt.x && ty === vt.y))
        {
            continue;
        }
        var path = findPath(vt.x, vt.y, tx, ty, v.dirs);
        if (path !== null)
        {
            v.path = path;
            v.target = { objId: null, after: 'idle' };
            v.state = 'walk';
            return true;
        }
    }
    return false;
}

function getObj(id)
{
    for (var i = 0; i < S.objects.length; i++)
    {
        if (S.objects[i].id === id)
        {
            return S.objects[i];
        }
    }
    return null;
}

function visitorDecide(v)
{
    // critical needs first
    var needs = ['toilet', 'hunger', 'thirst', 'energy'];
    for (var n = 0; n < needs.length; n++)
    {
        var need = needs[n];
        if (v.needs[need] >= 58)
        {
            var fac = facilityForNeed(need);
            if (fac && goToObject(v, fac, 'use'))
            {
                return;
            }
            if (!v.penalized[need])
            {
                v.penalized[need] = true;
                v.sat -= 6;
                addEmote(v.x, v.y - 24, need);
                addEmote(v.x + 8, v.y - 30, 'angry');
            }
            v.needs[need] = 25; // gives up, and won't nag again for a while
        }
    }
    // done viewing -> gift shop -> leave
    if (v.viewed.length >= v.quota || v.needs.energy >= 95)
    {
        if (!v.giftDone && v.money >= 250)
        {
            var gift = null;
            for (var i = 0; i < S.objects.length; i++)
            {
                if (S.objects[i].type === 'gift')
                {
                    gift = S.objects[i];
                    break;
                }
            }
            if (gift && goToObject(v, gift, 'use'))
            {
                v.giftDone = true;
                return;
            }
        }
        leaveMap(v);
        return;
    }
    // wander around a bit between attractions
    if (v.strolls < 2 && Math.random() < 0.10)
    {
        if (goToRandomTile(v))
        {
            v.strolls++;
            return;
        }
    }
    // fun facilities sometimes (photo zone, arcade corner)
    if (!v.photoDone && Math.random() < 0.18)
    {
        var funs = [];
        for (var p = 0; p < S.objects.length; p++)
        {
            var fp = S.objects[p];
            if (fp.type === 'photo' || BUILD[fp.type].fun)
            {
                funs.push(fp);
            }
        }
        if (funs.length > 0)
        {
            var funPick = funs[Math.floor(Math.random() * funs.length)];
            var funState = (funPick.type === 'photo') ? 'photo' : 'use';
            if (goToObject(v, funPick, funState))
            {
                v.photoDone = true;
                return;
            }
        }
    }
    var tank = pickTank(v);
    if (tank)
    {
        if (goToObject(v, tank, 'view'))
        {
            return;
        }
    }
    // nothing to see
    if (v.viewed.length === 0 && !v.penalized.empty)
    {
        v.penalized.empty = true;
        v.sat -= 15;
        addEmote(v.x, v.y - 24, 'angry');
    }
    leaveMap(v);
}

function leaveMap(v)
{
    var vt = { x: Math.floor(v.x / TS), y: Math.floor(v.y / TS) };
    var path = findPath(vt.x, vt.y, ENTRANCE.x, ENTRANCE.y, v.dirs);
    if (path === null)
    {
        v.state = 'gone';
        return;
    }
    v.path = path;
    v.target = null;
    v.state = 'leaving';
}

function finishVisit(v)
{
    // fee grumble
    var fair = 60 + S.fame * 1.5;
    if (S.fee > fair)
    {
        v.sat -= (S.fee - fair) / 25;
    }
    var s = v.sat;
    var review;
    var color;
    if (s >= 65)
    {
        gainFame(2);
        review = REVIEWS_GOOD[Math.floor(Math.random() * REVIEWS_GOOD.length)];
        color = '#ffe060';
    }
    else
    {
        if (s >= 38)
        {
            gainFame(1);
            review = REVIEWS_MID[Math.floor(Math.random() * REVIEWS_MID.length)];
            color = '#d0f0ff';
        }
        else
        {
            if (s < 25)
            {
                S.fame = Math.max(0, S.fame - 1);
            }
            review = REVIEWS_BAD[Math.floor(Math.random() * REVIEWS_BAD.length)];
            color = '#ffb0a0';
        }
    }
    addFloat(v.x, v.y - 20, review, color);
}

function updateVisitor(v, dt)
{
    var rates = needDecayRates();
    for (var k in v.needs)
    {
        v.needs[k] = Math.min(100, v.needs[k] + rates[k] * dt);
    }
    v.animT += dt;
    if (v.animT > 0.18)
    {
        v.animT = 0;
        v.animFrame = 1 - v.animFrame;
    }

    if (v.state === 'decide')
    {
        v.moving = false;
        visitorDecide(v);
        return;
    }
    if (v.state === 'walk' || v.state === 'leaving')
    {
        if (!v.path || v.path.length === 0)
        {
            if (v.state === 'leaving')
            {
                // reached entrance
                finishVisit(v);
                v.state = 'gone';
                return;
            }
            // arrived after a stroll: look around for a moment
            if (v.target && v.target.objId === null)
            {
                v.state = 'idle';
                v.stateT = 0;
                v.idleDur = 0.35 + Math.random() * 0.55;
                v.moving = false;
                v.dir = (Math.random() < 0.5) ? 'up' : 'down';
                return;
            }
            // arrived at stand tile
            var obj = v.target ? getObj(v.target.objId) : null;
            if (!obj)
            {
                v.state = 'decide';
                return;
            }
            v.state = v.target.after;
            v.stateT = 0;
            v.moving = false;
            // face the object (4 directions)
            var fdx = (obj.x + oW(obj) / 2) * TS - v.x;
            var fdy = (obj.y + oH(obj) / 2) * TS - v.y;
            if (Math.abs(fdx) > Math.abs(fdy))
            {
                v.dir = 'side';
                v.flipX = (fdx < 0);
            }
            else
            {
                v.dir = (fdy < 0) ? 'up' : 'down';
            }
            return;
        }
        var node = v.path[0];
        var tx = (node[0] !== undefined ? node[0] : node.x);
        var ty = (node[1] !== undefined ? node[1] : node.y);
        var px = (tx + 0.5) * TS;
        var py = (ty + 0.5) * TS;
        var dx = px - v.x;
        var dy = py - v.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        // floor tile under the visitor speeds them up and can pay out
        var fl = floorAt(Math.floor(v.x / TS), Math.floor(v.y / TS));
        var floorSpeed = 1;
        if (fl)
        {
            if (fl.speed)
            {
                floorSpeed = fl.speed;
            }
            if (fl.sat)
            {
                v.sat += fl.sat * dt;
            }
            if (fl.tip && Math.random() < fl.tip * dt)
            {
                var tip = 20 + Math.floor(Math.random() * 40);
                S.money += tip;
                S.mon.shopIn += tip;
                addFloat(v.x, v.y - 24, '+' + tip + 'G', '#ffe060');
            }
            if (fl.rp && Math.random() < fl.rp * dt)
            {
                S.rp += 1;
                addFloat(v.x, v.y - 24, '+1 ' + THEME.text.rpWord, '#d0a0ff');
            }
        }
        var step = v.vt.speed * floorSpeed * buffMul('speed') * dt;
        v.moving = true;
        if (Math.abs(dx) > Math.abs(dy) * 1.2)
        {
            v.dir = 'side';
            v.flipX = (dx < 0);
        }
        else
        {
            v.dir = (dy < -1) ? 'up' : 'down';
        }
        if (dist <= step)
        {
            v.x = px;
            v.y = py;
            // check next cell still walkable
            v.path.shift();
            if (v.path.length > 0)
            {
                var nn = v.path[0];
                var nx = (nn[0] !== undefined ? nn[0] : nn.x);
                var ny = (nn[1] !== undefined ? nn[1] : nn.y);
                if (!isWalkable(nx, ny))
                {
                    v.path = null;
                    v.state = 'decide';
                }
            }
        }
        else
        {
            v.x += dx / dist * step;
            v.y += dy / dist * step;
        }
        return;
    }
    if (v.state === 'idle')
    {
        v.stateT += dt;
        v.moving = false;
        if (v.stateT >= v.idleDur)
        {
            v.state = 'decide';
        }
        return;
    }
    if (v.state === 'view')
    {
        v.stateT += dt;
        var obj2 = v.target ? getObj(v.target.objId) : null;
        if (!obj2 || !obj2.species)
        {
            v.state = 'decide';
            return;
        }
        if (v.stateT > 0.7 && !v.heartDone)
        {
            v.heartDone = true;
            addEmote(v.x, v.y - 26, 'heart');
        }
        if (v.stateT >= 1.25)
        {
            v.heartDone = false;
            v.viewed.push(obj2.id);
            var appeal = tankAppeal(obj2);
            v.sat += Math.min(20, 4 + appeal * 0.3);
            var sp = SPECIES[obj2.species];
            // research gain (artists and scholars multiply it)
            if (Math.random() < 0.3 + sp.rpY * 0.02)
            {
                var gain = Math.round(Math.max(1, Math.ceil(sp.rpY / 3)) * (v.vt.rpMul || 1) * buffMul('rp'));
                S.rp += gain;
                addFloat(v.x, v.y - 26, '+' + gain + ' ' + THEME.text.rpWord, '#d0a0ff');
            }
            if (Math.random() < 0.06)
            {
                gainFame(1);
            }
            // streamers broadcast what they see
            if (v.vt.fameChance && Math.random() < v.vt.fameChance)
            {
                gainFame(1);
                addEmote(v.x + 8, v.y - 30, 'camera');
            }
            v.state = 'decide';
        }
        return;
    }
    if (v.state === 'photo')
    {
        v.stateT += dt;
        if (v.stateT > 0.5 && !v.camDone)
        {
            v.camDone = true;
            addEmote(v.x, v.y - 26, 'camera');
        }
        if (v.stateT >= 1.2)
        {
            v.camDone = false;
            v.sat += 6;
            if (Math.random() < 0.4)
            {
                gainFame(1);
            }
            v.state = 'decide';
        }
        return;
    }
    if (v.state === 'use')
    {
        v.stateT += dt;
        if (v.stateT >= 1.1)
        {
            var fo = v.target ? getObj(v.target.objId) : null;
            if (fo)
            {
                var fb = BUILD[fo.type];
                var price = Math.round(fb.sell * (v.vt.spendMul || 1) * buffMul('income'));
                if (fb.sell > 0 && v.money >= price)
                {
                    v.money -= price;
                    S.money += price;
                    S.mon.shopIn += price;
                    addFloat((fo.x + 0.5) * TS, fo.y * TS, '+' + price + 'G', '#ffe060');
                    sfx('coin');
                    v.sat += 5;
                }
                if (fb.need)
                {
                    v.needs[fb.need] = 5;
                    if (fb.rest)
                    {
                        v.needs.energy = 10;
                    }
                    if (fb.need === 'hunger' || fb.need === 'thirst')
                    {
                        v.needs.toilet = Math.min(100, v.needs.toilet + 18);
                    }
                    v.sat += 3;
                }
                if (fo.type === 'bench')
                {
                    v.needs.energy = 5;
                }
                if (fo.type === 'gift')
                {
                    v.sat += 6;
                }
                if (fb.fun)
                {
                    v.sat += 8;
                    addEmote(v.x, v.y - 26, 'note');
                    if (Math.random() < 0.3)
                    {
                        gainFame(1);
                    }
                }
            }
            v.state = 'decide';
        }
        return;
    }
}

// ---------- time / economy ----------
function feeFactor()
{
    // the 'fee' buff makes visitors less sensitive to the ticket price
    var f = 1.35 - S.fee / ((150 + S.fame * 4) * (1 + buffAdd('fee')));
    if (f < 0.15)
    {
        f = 0.15;
    }
    if (f > 1.25)
    {
        f = 1.25;
    }
    return f;
}

function expectedPerDay()
{
    var e = (1.6 + S.fame * 0.05 + S.level * 1.2) * feeFactor();
    e *= THEME.seasonMult[seasonOf(S.month)];
    if (S.stormMonth)
    {
        e *= 0.35;
    }
    if (S.specialEx)
    {
        e *= 1.35;
    }
    return e;
}

// cosmetic particles (floats/emotes/dust) age independently of the sim,
// so they keep animating while the game is paused for placement
function updateFx(dt)
{
    for (var f = FLOATS.length - 1; f >= 0; f--)
    {
        FLOATS[f].t += dt;
        if (FLOATS[f].t > 1.6)
        {
            FLOATS.splice(f, 1);
        }
    }
    for (var e = EMOTES.length - 1; e >= 0; e--)
    {
        EMOTES[e].t += dt;
        if (EMOTES[e].t > 1.1)
        {
            EMOTES.splice(e, 1);
        }
    }
    for (var pf = PUFFS.length - 1; pf >= 0; pf--)
    {
        PUFFS[pf].t += dt;
        PUFFS[pf].x += PUFFS[pf].vx * dt;
        if (PUFFS[pf].t > 0.55)
        {
            PUFFS.splice(pf, 1);
        }
    }
}

// does this placeable participate in any undiscovered-or-discovered spot?
// type: build type id; species: current species for exhibits (may be null)
function inAnyCombo(type, species)
{
    var b = BUILD[type];
    for (var c = 0; c < COMBOS.length; c++)
    {
        var reqs = COMBOS[c].req;
        for (var r = 0; r < reqs.length; r++)
        {
            var q = reqs[r];
            if (q.type && q.type === type)
            {
                return true;
            }
            if (q.species && species && q.species === species)
            {
                return true;
            }
            if (q.cls && b.kind === 'tank' && b.cls >= q.cls)
            {
                return true;
            }
        }
    }
    return false;
}

var questT = 0;

function advanceSim(dtMs)
{
    var dt = dtMs / 1000;
    GAME_TIME += dt;

    // quest progress check (also during preparation phase)
    questT += dt;
    if (questT >= 1)
    {
        questT = 0;
        checkQuest();
    }

    if (S.opened)
    {
        // paced spawning: accumulator plus a minimum gap between arrivals
        S.spawnAcc += expectedPerDay() * (dtMs / DAY_MS);
        S.spawnCd -= dt;
        // groupBurst is a countdown in seconds: a crowd streams in fast
        var bursting = (S.groupBurst > 0);
        if (bursting)
        {
            S.groupBurst -= dt;
            if (S.groupBurst < 0)
            {
                S.groupBurst = 0;
            }
            S.spawnAcc += dt * 4;
        }
        var accCap = bursting ? 8 : 4;
        if (S.spawnAcc > accCap)
        {
            S.spawnAcc = accCap;
        }
        if (S.spawnAcc >= 1 && S.spawnCd <= 0 && VISITORS.length < maxVisitorsNow())
        {
            S.spawnAcc -= 1;
            S.spawnCd = bursting ? 0.15 : 0.4 + Math.random() * 0.5;
            spawnVisitor();
        }

        updateFeeding(dt);
        updateShow(dt);
    }

    // visitors
    for (var i = VISITORS.length - 1; i >= 0; i--)
    {
        updateVisitor(VISITORS[i], dt);
        if (VISITORS[i].state === 'gone')
        {
            VISITORS.splice(i, 1);
        }
    }

    updateFx(dt);

    // calendar only runs after the grand opening
    if (S.opened)
    {
        S.dayMs += dtMs;
        if (S.dayMs >= DAY_MS)
        {
            S.dayMs -= DAY_MS;
            S.day++;
            onDayTick();
            if (S.day > DAYS_PER_MONTH)
            {
                S.day = 1;
                monthEnd();
            }
        }
    }
}

// per-day processing: expedition, special exhibition, show cooldown, cat care
function onDayTick()
{
    tickRequests();
    tickJobUnlocks();
    if (S.showCd > 0)
    {
        S.showCd--;
    }
    if (THEME.feature === 'expedition')
    {
        if (S.expedition)
        {
            S.expedition.days--;
            if (S.expedition.days <= 0)
            {
                finishExpedition();
            }
        }
        if (S.specialEx)
        {
            S.specialEx.days--;
            if (S.specialEx.days <= 0)
            {
                finishSpecialEx();
            }
        }
    }
    if (THEME.feature === 'mood')
    {
        for (var i = 0; i < S.objects.length; i++)
        {
            var o = S.objects[i];
            if (BUILD[o.type].kind === 'tank' && o.species)
            {
                var drop = 1 + ((Math.random() < 0.3) ? 1 : 0);
                o.mood = Math.max(20, (o.mood === undefined ? 80 : o.mood) - drop);
            }
        }
        catRelationEvents();
    }
}

// neighboring cats sometimes squabble (bad match) or snuggle (good match)
function catRelationEvents()
{
    var tanks = S.objects.filter(function (o) { return BUILD[o.type].kind === 'tank' && o.species; });
    for (var i = 0; i < tanks.length; i++)
    {
        for (var j = i + 1; j < tanks.length; j++)
        {
            var a = tanks[i];
            var b = tanks[j];
            var dist = Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
            if (dist > 2)
            {
                continue;
            }
            var rel = persRelation(SPECIES[a.species].pers, SPECIES[b.species].pers);
            if (rel < 0 && Math.random() < 0.08)
            {
                a.mood = Math.max(20, (a.mood || 80) - 8);
                b.mood = Math.max(20, (b.mood || 80) - 8);
                addEmote((a.x + 0.5) * TS, a.y * TS, 'angry');
                addEmote((b.x + 0.5) * TS, b.y * TS, 'angry');
                if (Math.random() < 0.4)
                {
                    showToast('💢 ' + SPECIES[a.species].name + '와(과) ' + SPECIES[b.species].name + '이(가) 투닥거렸다!');
                }
            }
            else
            {
                if (rel > 0 && Math.random() < 0.05)
                {
                    a.mood = Math.min(100, (a.mood || 80) + 4);
                    b.mood = Math.min(100, (b.mood || 80) + 4);
                    addEmote((a.x + 0.5) * TS, a.y * TS, 'heart');
                    addEmote((b.x + 0.5) * TS, b.y * TS, 'heart');
                }
            }
        }
    }
}

// ---------- quest chain ----------
function currentQuest()
{
    var list = THEME.quests || [];
    if (S.questIdx === undefined)
    {
        S.questIdx = 0;
    }
    return (S.questIdx < list.length) ? list[S.questIdx] : null;
}

function checkQuest()
{
    var q = currentQuest();
    if (!q || !q.check(S))
    {
        return;
    }
    var r = q.reward || {};
    var parts = [];
    if (r.g)
    {
        S.money += r.g;
        parts.push('💰 +' + fmt(r.g) + 'G');
    }
    if (r.rp)
    {
        S.rp += r.rp;
        parts.push(THEME.rpIcon + ' +' + r.rp + THEME.text.rpWord);
    }
    if (r.fame)
    {
        S.fame += r.fame;
        parts.push('💗 인기 +' + r.fame);
    }
    S.questIdx++;
    sfx('quest');
    var next = currentQuest();
    queueModal({
        title: '📌 목표 달성!',
        body: '<div style="text-align:center;"><b style="font-size:16px;color:#c07000;">「' + q.name + '」</b><br>완료!<br><br>' + parts.join('<br>') +
            (next ? '<br><br><span class="small">다음 목표: ' + next.name + '</span>' : '<br><br><b style="color:#d04080;">모든 목표를 달성했다! 대단해!</b>') + '</div>',
        buttons: [{ label: '좋아!', cls: '' }]
    });
}

// ---------- request board ----------
// visitors post requests; completing them pays out money/points and the
// special ones unlock exclusive buildings in the build menu
function jobName(id)
{
    for (var i = 0; i < VTYPES.length; i++)
    {
        if (VTYPES[i].id === id)
        {
            return VTYPES[i].name;
        }
    }
    return '손님';
}

// build one repeatable request appropriate to the current game state
// best exhibit class the player already owns
function ownedMaxCls()
{
    var m = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        var b = BUILD[S.objects[i].type];
        if (b.kind === 'tank' && b.cls > m)
        {
            m = b.cls;
        }
    }
    return m;
}

// best exhibit class the player could realistically get right now
function reachableMaxCls()
{
    var m = ownedMaxCls();
    for (var k in BUILD)
    {
        var b = BUILD[k];
        if (b.kind === 'tank' && b.lvReq <= S.level && b.cost <= S.money * 1.4 + 400 && b.cls > m)
        {
            m = b.cls;
        }
    }
    return m;
}

function genRequest()
{
    var posters = VTYPES.filter(function (t) { return S.fame >= (t.unlockFame || 0) && !t.rare; });
    var poster = posters[Math.floor(Math.random() * posters.length)].id;
    var kinds = [];
    var cls = reachableMaxCls();
    var budget = S.money * 1.4 + 400;

    // only ask for exhibits the player can actually house and obtain:
    // already researched first, otherwise something nearly affordable
    var wishes = SPECIES_ORDER.filter(function (id)
    {
        var sp = SPECIES[id];
        return sp.lvReq <= S.level && sp.cls <= cls && sp.stock <= budget &&
            !qDisplayed(S, id) && S.unlocked.indexOf(id) >= 0;
    });
    if (wishes.length === 0)
    {
        wishes = SPECIES_ORDER.filter(function (id)
        {
            var sp = SPECIES[id];
            return sp.lvReq <= S.level && sp.cls <= cls && sp.stock <= budget &&
                !qDisplayed(S, id) && sp.rpCost <= S.rp + 25;
        });
    }
    if (wishes.length > 0)
    {
        kinds.push('display');
    }

    // only ask for buildings that are unlocked, not reward-locked and affordable
    var facWish = ['snack', 'ice', 'photo', 'garden', 'foodcart', 'game', 'vend', 'bench', 'sign', 'flower', 'toilet'].filter(function (t)
    {
        var b = BUILD[t];
        return b && !b.reqLock && b.lvReq <= S.level && b.cost <= budget && !hasType(S, t);
    });
    if (facWish.length > 0)
    {
        kinds.push('fac');
    }

    kinds.push('visitors');
    if (S.combosDone.length < COMBOS.length && S.objects.length >= 3)
    {
        kinds.push('combo');
    }

    // upgrade requests must push past the current best level, and only if
    // some exhibit sitting at that level can actually be paid for
    var maxLv = 1;
    for (var mk in S.spLv)
    {
        if (S.spLv[mk] > maxLv)
        {
            maxLv = S.spLv[mk];
        }
    }
    var upTarget = Math.min(5, maxLv + 1);
    var upWish = [];
    if (maxLv < 5)
    {
        for (var u = 0; u < S.unlocked.length; u++)
        {
            var uid = S.unlocked[u];
            if ((S.spLv[uid] || 1) === maxLv && spLvUpCost(uid) <= S.rp * 1.5 + 20)
            {
                upWish.push(uid);
            }
        }
    }
    if (upWish.length > 0)
    {
        kinds.push('lvup');
    }

    var kind = kinds[Math.floor(Math.random() * kinds.length)];
    // regular requests time out so an ignored one never blocks the board
    var r = { id: S.reqSeq++, kind: kind, poster: poster, days: 26 + Math.floor(Math.random() * 14) };
    if (kind === 'display')
    {
        var w = wishes[Math.floor(Math.random() * wishes.length)];
        r.sp = w;
        r.desc = '「' + SPECIES[w].name + '」' + '을(를) 꼭 보고 싶어요!';
        r.reward = { g: 800 + SPECIES[w].rpCost * 6 };
    }
    if (kind === 'fac')
    {
        var f = facWish[Math.floor(Math.random() * facWish.length)];
        r.fac = f;
        r.desc = '「' + BUILD[f].name + '」이(가) 있으면 좋겠어요!';
        r.reward = { g: 600 + BUILD[f].cost };
    }
    if (kind === 'visitors')
    {
        var add = 30 + S.level * 15;
        r.target = S.visTotal + add;
        r.add = add;
        r.desc = '친구들에게 소문낼게요! 손님 ' + add + '명을 더 모아봐요!';
        r.reward = { rp: 40 + S.level * 20 };
    }
    if (kind === 'combo')
    {
        r.target = S.combosDone.length + 1;
        r.desc = '특별한 명소가 보고 싶어요! 비밀 스폿을 1개 더 발견해요!';
        r.reward = { g: 1500, rp: 30 };
    }
    if (kind === 'lvup')
    {
        r.target = upTarget;
        r.desc = '더 대단한 전시가 보고 싶어요! 아무 전시물이나 Lv' + r.target + '로 강화해요!';
        r.reward = { g: 1200 + r.target * 600 };
    }
    return r;
}

function requestMet(r)
{
    if (r.kind === 'display')
    {
        return qDisplayed(S, r.sp);
    }
    if (r.kind === 'fac')
    {
        return hasType(S, r.fac);
    }
    if (r.kind === 'visitors')
    {
        return S.visTotal >= r.target;
    }
    if (r.kind === 'combo')
    {
        return S.combosDone.length >= r.target;
    }
    if (r.kind === 'lvup')
    {
        for (var k in S.spLv)
        {
            if (S.spLv[k] >= r.target)
            {
                return true;
            }
        }
        return false;
    }
    if (r.kind === 'fame')
    {
        return S.fame >= r.target;
    }
    if (r.kind === 'visitorsTotal')
    {
        return S.visTotal >= r.target;
    }
    if (r.kind === 'lv')
    {
        return S.level >= r.target;
    }
    return false;
}

function requestProgress(r)
{
    if (r.kind === 'visitors' || r.kind === 'visitorsTotal')
    {
        return Math.min(S.visTotal, r.target) + '/' + r.target;
    }
    if (r.kind === 'combo')
    {
        return Math.min(S.combosDone.length, r.target) + '/' + r.target;
    }
    if (r.kind === 'fame')
    {
        return Math.min(S.fame, r.target) + '/' + r.target;
    }
    if (r.kind === 'lv')
    {
        return starStr(S.level) + ' / ' + starStr(r.target);
    }
    return null;
}

function completeRequest(r)
{
    var idx = S.requests.indexOf(r);
    if (idx >= 0)
    {
        S.requests.splice(idx, 1);
    }
    var parts = [];
    var rw = r.reward || {};
    if (rw.g)
    {
        S.money += rw.g;
        parts.push('💰 +' + fmt(rw.g) + 'G');
    }
    if (rw.rp)
    {
        S.rp += rw.rp;
        parts.push(THEME.rpIcon + ' +' + rw.rp + THEME.text.rpWord);
    }
    var facTxt = '';
    if (r.rewardFac && S.facUnlocked.indexOf(r.rewardFac) < 0)
    {
        S.facUnlocked.push(r.rewardFac);
        facTxt = '<div style="margin-top:8px;background:#fff0c8;border:2px solid #e0b050;border-radius:8px;padding:8px;text-align:center;">🎁 새로운 건축물 해금!<br><b style="color:#c07000;">「' + BUILD[r.rewardFac].name + '」</b><br><span class="small">건설 메뉴에서 지을 수 있어요</span></div>';
    }
    if (r.rewardBuff && BUFFS[r.rewardBuff])
    {
        var bf = BUFFS[r.rewardBuff];
        S.buffs[r.rewardBuff] = (S.buffs[r.rewardBuff] || 0) + 1;
        facTxt += '<div style="margin-top:8px;background:#e8f4ff;border:2px solid #6aa8dd;border-radius:8px;padding:8px;text-align:center;">' + bf.icon + ' 영구 버프 획득!<br><b style="color:#2f6fb0;">「' + bf.name + '」 Lv' + S.buffs[r.rewardBuff] + '</b><br><span class="small">' + bf.desc + '</span></div>';
    }
    S.fame += 5;
    sfx('quest');
    queueModal({
        title: '📋 의뢰 달성!',
        body: '<div style="text-align:center;">「' + jobName(r.poster) + '」의 의뢰를 해결했다!<br><span class="small">' + r.desc + '</span><br><br>' + parts.join(' · ') + (parts.length ? '<br>' : '') + '💗 인기 +5</div>' + facTxt,
        buttons: [{ label: '좋았어!', cls: '' }]
    });
}

// daily request upkeep: complete met requests, deliver new ones
function tickRequests()
{
    for (var i = S.requests.length - 1; i >= 0; i--)
    {
        if (requestMet(S.requests[i]))
        {
            completeRequest(S.requests[i]);
            return; // one celebration per day
        }
    }
    // age out regular requests (special ones wait forever)
    for (var e = S.requests.length - 1; e >= 0; e--)
    {
        var rq = S.requests[e];
        if (rq.special || rq.days === undefined)
        {
            continue;
        }
        rq.days--;
        if (rq.days <= 0)
        {
            S.requests.splice(e, 1);
            showToast('📋 「' + jobName(rq.poster) + '」의 의뢰가 기한이 지나 사라졌어요');
        }
    }
    // one-time special requests appear when famous enough
    var specials = THEME.specialRequests || [];
    for (var s = 0; s < specials.length; s++)
    {
        var sr = specials[s];
        if (S.fame >= sr.fameReq && S.reqSpecialDone.indexOf(sr.id) < 0 &&
            !S.requests.some(function (q) { return q.special === sr.id; }))
        {
            S.reqSpecialDone.push(sr.id);
            S.requests.push({
                id: S.reqSeq++, kind: sr.kind, target: sr.target, poster: sr.poster,
                desc: sr.desc, rewardFac: sr.rewardFac, rewardBuff: sr.rewardBuff,
                special: sr.id, reward: { g: 2000 }
            });
            sfx('modal');
            showToast('📋 특별한 의뢰가 게시판에 붙었습니다!');
            return;
        }
    }
    // the three-slot cap applies to regular requests only: long-running
    // special requests must not stop new ones from arriving
    var generics = 0;
    for (var q = 0; q < S.requests.length; q++)
    {
        if (!S.requests[q].special)
        {
            generics++;
        }
    }
    if (generics >= 3)
    {
        return;
    }
    S.reqTimer--;
    if (S.reqTimer <= 0)
    {
        S.reqTimer = 10 + Math.floor(Math.random() * 8);
        S.requests.push(genRequest());
        sfx('modal');
        showToast('📋 새 의뢰가 게시판에 도착했습니다!');
    }
}

// announce newly unlocked visitor job types (one per day)
function tickJobUnlocks()

    {

        if (S.fame >= (t.unlockFame || 0) && S.jobsAnnounced.indexOf(t.id) < 0)

                buttons: [{ label: '어서오세요!', cls: '' }]
            });

        }
    }
}

{

// ---------- feeding time (aquarium feature) ----------
function updateFeeding(dt)
{
    if (THEME.feature !== 'feeding')
    {
        return;
    }
    if (FEED)
    {
        FEED.t -= dt;
        if (FEED.t <= 0 || !getObj(FEED.objId))
        {
            FEED = null;
        }
        return;
    }
    feedCd -= dt;
    if (feedCd <= 0)
    {
        feedCd = 25 + Math.random() * 20;
        var tanks = S.objects.filter(function (o) { return BUILD[o.type].kind === 'tank' && o.species; });
        if (tanks.length > 0 && VISITORS.length > 0)
        {
            var pick = tanks[Math.floor(Math.random() * tanks.length)];
            FEED = { objId: pick.id, t: 7 };
        }
    }
}

function doFeed(o)
{
    FEED = null;
    S.feedCount = (S.feedCount || 0) + 1;
    var owf = oW(o);
    var ohf = oH(o);
    var cx = (o.x + owf / 2) * TS;
    var cy = o.y * TS;
    addEmote(cx - 8, cy, 'heart');
    addEmote(cx + 8, cy - 6, 'sparkle');
    addEmote(cx, cy - 12, 'note');
    var gain = 2 + (o.lv || 1);
    S.rp += gain;
    addFloat(cx, cy - 6, '+' + gain + ' ' + THEME.text.rpWord, '#d0a0ff');
    // nearby visitors get excited
    var n = 0;
    for (var i = 0; i < VISITORS.length; i++)
    {
        var v = VISITORS[i];
        var dx = Math.abs(v.x / TS - (o.x + owf / 2));
        var dy = Math.abs(v.y / TS - (o.y + ohf / 2));
        if (dx <= 3.5 && dy <= 3.5)
        {
            v.sat += 7;
            addEmote(v.x, v.y - 26, 'heart');
            n++;
        }
    }
    if (Math.random() < 0.5)
    {
        gainFame(2);
    }
    sfx('feed');
    showToast('🍴 먹이 시간! 물고기들이 신났다! (' + n + '명이 좋아함)');
}

// ---------- expedition (museum feature) ----------
function expeditionDays(id)
{
    return 3 + SPECIES[id].cls * 2;
}

var EXPEDITION_SITES = ['사막 유적', '고대 무덤', '화석 절벽', '침몰선', '빙하 동굴', '정글 신전'];

function startExpedition(id)
{
    if (S.expedition)
    {
        showToast('발굴대가 이미 나가 있어요!');
        return false;
    }
    var sp = SPECIES[id];
    if (S.rp < sp.rpCost)
    {
        showToast(THEME.text.rpWord + '가 부족합니다');
        return false;
    }
    S.rp -= sp.rpCost;
    S.expedCount = (S.expedCount || 0) + 1;
    S.expedition = { sp: id, days: expeditionDays(id), site: EXPEDITION_SITES[Math.floor(Math.random() * EXPEDITION_SITES.length)] };
    sfx('place');
    showToast('🧭 발굴대가 ' + S.expedition.site + '(으)로 떠났습니다!');
    return true;
}

function finishExpedition()
{
    var ex = S.expedition;
    S.expedition = null;
    var sp = SPECIES[ex.sp];
    if (S.unlocked.indexOf(ex.sp) < 0)
    {
        S.unlocked.push(ex.sp);
        S.spLv[ex.sp] = 1;
    }
    checkDex();
    var bonusTxt = '';
    if (Math.random() < 0.35)
    {
        var bonus = sp.cls * 150 + Math.floor(Math.random() * 400);
        S.money += bonus;
        bonusTxt = '<br>💰 게다가 보물도 발견! +' + bonus + 'G';
    }
    sfx('unlock');
    queueModal({
        title: '⛏️ 발굴 성공!',
        body: '<div style="text-align:center;">' + ex.site + '에서 발굴대가 돌아왔습니다!<br><br><b style="font-size:16px;color:#c07000;">「' + sp.name + '」 획득!</b>' + bonusTxt +
            '<br><span class="small">전시대를 탭해서 전시해 보세요</span></div>',
        buttons: [{ label: '대단해!', cls: '' }]
    });
}

// ---------- cat care (cat cafe feature) ----------
function playWithCat(o)
{
    if (!o.species)
    {
        return;
    }
    var mood = (o.mood === undefined) ? 80 : o.mood;
    if (mood >= 95)
    {
        showToast('이미 신나서 꼬리를 흔들고 있어요!');
        return;
    }
    o.mood = Math.min(100, mood + 25);
    S.playCount = (S.playCount || 0) + 1;
    var cx = (o.x + oW(o) / 2) * TS;
    addEmote(cx - 6, o.y * TS, 'heart');
    addEmote(cx + 6, o.y * TS - 8, 'note');
    if (Math.random() < 0.5)
    {
        gainFame(1);
    }
    sfx('coin');
    showToast('🪀 ' + SPECIES[o.species].name + '이(가) 신났다! 기분 +25');
}

// ---------- show stage (aquarium feature) ----------
function firstShowSpecies()
{
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        if (BUILD[o.type].kind === 'tank' && o.species && SPECIES[o.species].show)
        {
            return o.species;
        }
    }
    return null;
}

function startShow(stage)
{
    if (SHOW)
    {
        return;
    }
    if (S.showCd > 0)
    {
        showToast('다음 공연까지 ' + S.showCd + '일 남았어요');
        return;
    }
    var performer = firstShowSpecies();
    if (!performer)
    {
        showToast('공연할 동물이 없어요! (수달·펭귄·돌고래·벨루가)');
        sfx('bad');
        return;
    }
    S.showCd = 6;
    S.showCount = (S.showCount || 0) + 1;
    SHOW = { objId: stage.id, sp: performer, t: 6 };
    var sw = oW(stage);
    var sh = oH(stage);
    var cx = (stage.x + sw / 2) * TS;
    var cy = (stage.y + sh / 2) * TS;
    // nearby visitors buy show tickets and love it
    var n = 0;
    var income = 0;
    for (var i = 0; i < VISITORS.length; i++)
    {
        var v = VISITORS[i];
        var dx = Math.abs(v.x / TS - (stage.x + sw / 2));
        var dy = Math.abs(v.y / TS - (stage.y + sh / 2));
        if (dx <= 4.5 && dy <= 4.5)
        {
            var pay = Math.min(80, v.money);
            v.money -= pay;
            income += pay;
            v.sat += 12;
            addEmote(v.x, v.y - 26, 'heart');
            n++;
        }
    }
    S.money += income;
    S.mon.shopIn += income;
    if (income > 0)
    {
        addFloat(cx, cy - 20, '+' + income + 'G', '#ffe060');
    }
    gainFame(3);
    sfx('fanfare');
    showToast('🎤 ' + SPECIES[performer].name + ' 공연 시작! (' + n + '명 관람, +' + income + 'G)');
}

function updateShow(dt)
{
    if (!SHOW)
    {
        return;
    }
    SHOW.t -= dt;
    var stage = getObj(SHOW.objId);
    if (SHOW.t <= 0 || !stage)
    {
        SHOW = null;
        return;
    }
    // ambient music notes during the show
    if (Math.random() < dt * 2.5)
    {
        addEmote((stage.x + Math.random() * oW(stage)) * TS, stage.y * TS + 4, 'note');
    }
}

        buttons: [{ label: '개막!', cls: '' }]

function finishSpecialEx()

function monthEnd()
{
    // maintenance
    var maint = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        maint += BUILD[S.objects[i].type].maint;
    }
    maint += floorMaintTotal();
    S.money -= maint;
    S.mon.maint = maint;

    var rep = {
        year: S.year,
        month: S.month,
        vis: S.mon.vis,
        feeIn: S.mon.feeIn,
        shopIn: S.mon.shopIn,
        maint: maint
    };

    // fame decay
    S.fame = Math.max(0, S.fame - Math.ceil(S.fame * 0.015));

    // advance month
    S.month++;
    if (S.month > 12)
    {
        S.month = 1;
        S.year++;
    }
    S.mon = { vis: 0, feeIn: 0, shopIn: 0, maint: 0 };
    S.stormMonth = false;

    showMonthReport(rep);
    checkPromotion();
    if (rep.month === 12)
    {
        yearAwards();
    }
    if (S.month === 1)
    {
        sfx('newyear');
        queueModal({
            title: '🎍 새해가 밝았어요!',

            buttons: [{

function yearlyRanking()

    S.rank = rank;

    if (rank <= 30) { prize = 1000; }
    if (rank <= 20) { prize = 3000; }
    if (rank <= 10) { prize = 8000; }
    if (rank <= 3) { prize = 20000; }
    if (rank === 1) { prize = 50000; }
    S.money += prize;
    var body = '<div style="text-align:center;">올해의 ' + THEME.text.rankingTitle + '이 발표되었습니다!</div>' +
        '<div style="text-align:center;font-size:26px;color:#c07000;margin:10px 0;">전국 ' + rank + '위</div>';

    {
        body += '<div style="text-align:center;" class="good">작년보다 ' + (prev - rank) + '계단 상승!</div>';
    }
    if (prize > 0)
    {

function rollEvent()
{
    if (Math.random() > 0.32)
    {
        return;
    }
    var pool = [];
    for (var i = 0; i < EVENTS.length; i++)
    {
        var ev = EVENTS[i];
        if (ev.cond(S))
        {
            for (var w = 0; w < ev.weight; w++)
            {
                pool.push(ev);
            }
        }
    }
    if (pool.length === 0)
    {
        return;
    }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    if (pick.id && pick.id.indexOf('vip') === 0)
    {
        sfx('vip');
    }
    else
    {
        sfx('modal');
    }
    if (pick.choice)
    {
        queueModal({
            title: '📢 ' + pick.title,
            body: '<div style="text-align:center;">' + pick.text.replace(/\n/g, '<br>') + '</div>',
            buttons: [
                {
                    label: pick.yes, cls: '',
                    onClick: function ()
                    {
                        var r = pick.applyYes(S);
                        showToast(r);
                    }
                },
                {
                    label: pick.no, cls: 'gray',
                    onClick: function ()
                    {
                        var r = pick.applyNo(S);
                        showToast(r);
                    }
                }
            ]
        });
    }
    else
    {
        var result = pick.apply(S);
        queueModal({
            title: '📢 ' + pick.title,
            body: '<div style="text-align:center;">' + pick.text.replace(/\n/g, '<br>') + '<br><br><b style="color:#c07000;">' + result + '</b></div>',
            buttons: [{ label: '확인', cls: '' }]
        });
    }
}

function exportCode()
{
    S.saveTime = Date.now();
    var json = JSON.stringify(S);
    var b64;
    try
    {
        b64 = btoa(unescape(encodeURIComponent(json)));
    }
    catch (e)
    {
        return null;
    }
    return THEME.codePrefix + '.' + b64;
}

// returns null on success, or an error message
function importCode(str)
{
    try
    {
        str = (str || '').replace(/\s+/g, '');
        var dot = str.indexOf('.');
        if (dot <= 0)
        {
            return '코드 형식이 올바르지 않습니다';
        }
        var pre = str.substring(0, dot);
        if (pre !== THEME.codePrefix)
        {
            return '이 게임의 세이브 코드가 아닙니다';
        }
        var json = decodeURIComponent(escape(atob(str.substring(dot + 1))));
        var d = JSON.parse(json);
        if (typeof d.money !== 'number' || !d.objects || !d.unlocked)
        {
            return '코드가 손상된 것 같습니다';
        }
        localStorage.setItem(THEME.saveKey, json);
        loadGame();
        return null;
    }
    catch (e)
    {
        return '코드를 읽을 수 없습니다';
    }
}

// ---------- sound engine (chiptune) ----------
var audioCtx = null;
var sfxGain = null;
var musicGain = null;
var musicFilter = null;

// day/night cosmetic cycle (60s real loop); shared by visuals and music
function nightFactor()
{
    var ph = (GAME_TIME % 60) / 60;
    if (ph > 0.65 && ph <= 0.90)
    {
        return Math.min(1, (ph - 0.65) / 0.06);
    }
    if (ph > 0.90)
    {
        return Math.max(0, 1 - (ph - 0.90) / 0.10);
    }
    return 0;
}

function duskFactor()
{
    var ph = (GAME_TIME % 60) / 60;
    if (ph > 0.55 && ph <= 0.65)
    {
        return (ph - 0.55) / 0.10;
    }
    if (ph > 0.65 && ph <= 0.90)
    {
        return Math.max(0, 1 - (ph - 0.65) / 0.08);
    }
    return 0;
}

function initAudio()
{
    if (audioCtx)
    {
        // iOS can leave the context 'suspended' OR 'interrupted'
        // (home-screen apps after backgrounding) - resume on any non-running state
        if (audioCtx.state !== 'running')
        {
            try
            {
                audioCtx.resume();
            }
            catch (e)
            {
            }
        }
        return;
    }
    try
    {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sfxGain = audioCtx.createGain();
        sfxGain.gain.value = 1;
        sfxGain.connect(audioCtx.destination);
        musicGain = audioCtx.createGain();
        musicGain.gain.value = 0.7;
        // lowpass on the music bus lets us dim the tone at night/off-season
        musicFilter = audioCtx.createBiquadFilter();
        musicFilter.type = 'lowpass';
        musicFilter.frequency.value = 8000;
        musicGain.connect(musicFilter);
        musicFilter.connect(audioCtx.destination);
    }
    catch (e)
    {
        audioCtx = null;
    }
}

// iOS mutes WebAudio while the device is in silent mode unless an
// HTMLAudio element switches the audio session to playback. Loop a
// tiny silent wav (generated at runtime) on the first user gesture.
var unlockAudioEl = null;

function makeSilentWavUrl()
{
    var sr = 8000;
    var n = 800; // 0.1s of silence
    var buf = new ArrayBuffer(44 + n * 2);
    var v = new DataView(buf);
    function ws(o, s)
    {
        for (var i = 0; i < s.length; i++)
        {
            v.setUint8(o + i, s.charCodeAt(i));
        }
    }
    ws(0, 'RIFF');
    v.setUint32(4, 36 + n * 2, true);
    ws(8, 'WAVE');
    ws(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, 1, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    ws(36, 'data');
    v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function unlockIosAudio()
{
    if (unlockAudioEl)
    {
        if (unlockAudioEl.paused)
        {
            var pr0 = unlockAudioEl.play();
            if (pr0 && pr0.catch)
            {
                pr0.catch(function () {});
            }
        }
        return;
    }
    try
    {
        unlockAudioEl = document.createElement('audio');
        unlockAudioEl.setAttribute('playsinline', '');
        unlockAudioEl.loop = true;
        unlockAudioEl.volume = 0.01;
        unlockAudioEl.src = makeSilentWavUrl();
        var pr = unlockAudioEl.play();
        if (pr && pr.catch)
        {
            pr.catch(function () {});
        }
    }
    catch (e)
    {
        unlockAudioEl = null;
    }
}

// called on every user gesture: unlock/resume audio and make sure the
// BGM is running if it should be
function audioUnlockTap()
{
    initAudio();
    unlockIosAudio();
    if (S && S.bgmOn && THEME && !MUS.on && audioCtx)
    {
        startMusic(THEME.id);
    }
}

// note name (e.g. "C5", "F#4") to frequency
var NOTE_SEMI = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };

function noteFreq(n)
{
    var m = /^([A-G]#?)(\d)$/.exec(n);
    if (!m)
    {
        return 0;
    }
    var midi = (parseInt(m[2], 10) + 1) * 12 + NOTE_SEMI[m[1]];
    return 440 * Math.pow(2, (midi - 69) / 12);
}

// schedule one tone at an absolute audio-clock time
function tone(freq, dur, at, type, vol, target)
{
    if (!audioCtx || !freq)
    {
        return;
    }
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g);
    g.connect(target || sfxGain || audioCtx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.02);
}

// legacy helper used by sfx(): freq, dur, delay, type, vol
function beep(freq, dur, delay, type, vol)
{
    if (!audioCtx || (S && S.muted))
    {
        return;
    }
    tone(freq, dur, audioCtx.currentTime + (delay || 0), type || 'square', vol || 0.05, sfxGain);
}

// play a short melodic run of note names
function jingle(notes, step, type, vol)
{
    for (var i = 0; i < notes.length; i++)
    {
        beep(noteFreq(notes[i]), step * 1.6, i * step, type || 'square', vol || 0.05);
    }
}

{

}

// per-season musical feel: tempo scaling and brightness
var SEASON_MUS = {
    spring: { tempoMul: 1.00, bright: 1.00 },
    summer: { tempoMul: 1.06, bright: 1.15 },
    autumn: { tempoMul: 0.97, bright: 0.88 },
    winter: { tempoMul: 0.92, bright: 0.78 }
};

var MUS = { on: false, theme: null, tracks: [], hatTime: 0, timer: null, step: 0.2, baseBpm: 134, night: 0 };
var noiseBuf = null;

function getNoise()
{
    if (noiseBuf)
    {
        return noiseBuf;
    }
    var b = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.05), audioCtx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++)
    {
        d[i] = Math.random() * 2 - 1;
    }
    noiseBuf = b;
    return b;
}

function hat(at)
{
    if (!audioCtx)
    {
        return;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = getNoise();
    var f = audioCtx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 6500;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.012, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
    src.connect(f);
    f.connect(g);
    g.connect(musicGain);
    src.start(at);
    src.stop(at + 0.05);
}

function stopMusicTimer()
{
    if (MUS.timer)
    {
        clearInterval(MUS.timer);
        MUS.timer = null;
    }
}

function stopMusic()
{
    MUS.on = false;
    stopMusicTimer();
}

function startMusic(themeId)
{
    if (!audioCtx)
    {
        return;
    }
    MUS.theme = themeId;
    if (!(S && S.bgmOn))
    {
        return;
    }
    var song = SONGS[themeId];
    if (!song)
    {
        return;
    }
    stopMusicTimer();
    var t0 = audioCtx.currentTime + 0.15;
    MUS.baseBpm = song.bpm;
    MUS.step = 60 / song.bpm / 2;
    MUS.leadType = 'square';
    MUS.tracks = [
        { seq: song.lead, i: 0, next: t0, lead: true, vol: 0.032 },
        { seq: song.bass, i: 0, next: t0, type: 'triangle', vol: 0.05 }
    ];
    MUS.hatTime = t0;
    MUS.on = true;
    updateMusicMood();
    MUS.timer = setInterval(musicTick, 25);
}

// smoothly bend tempo, timbre, brightness and volume by season + night
function updateMusicMood()
{
    if (!audioCtx || !musicFilter || !S)
    {
        return;
    }
    var night = S.opened ? nightFactor() : 0;
    MUS.night = night;
    var sm = SEASON_MUS[seasonOf(S.month)] || SEASON_MUS.spring;
    // season tempo (night is slightly calmer too)
    MUS.step = (60 / MUS.baseBpm / 2) / (sm.tempoMul * (1 - night * 0.08));
    // night switches the lead to a mellow triangle and drops the hats
    MUS.leadType = (night > 0.5) ? 'triangle' : 'square';
    // brightness: bright day/season = open filter; night = muffled
    var cutoff = 700 + (7200 * sm.bright) * (1 - night * 0.82);
    var vol = 0.7 * (0.55 + sm.bright * 0.45) * (1 - night * 0.38);
    var now = audioCtx.currentTime;
    musicFilter.frequency.setTargetAtTime(cutoff, now, 0.4);
    musicGain.gain.setTargetAtTime(vol, now, 0.4);
}

function musicTick()
{
    if (!MUS.on || !audioCtx)
    {
        return;
    }
    if (!(S && S.bgmOn))
    {
        stopMusic();
        return;
    }
    updateMusicMood();
    var ahead = audioCtx.currentTime + 0.16;
    for (var k = 0; k < MUS.tracks.length; k++)
    {
        var tr = MUS.tracks[k];
        var guard = 0;
        while (tr.next < ahead && guard < 64)
        {
            guard++;
            var tok = tr.seq[tr.i];
            var c = tok.indexOf(':');
            var name = (c < 0) ? tok : tok.substring(0, c);
            var len = (c < 0) ? 1 : parseInt(tok.substring(c + 1), 10);
            var dur = len * MUS.step;
            if (name !== '.')
            {
                var ty = tr.lead ? MUS.leadType : tr.type;
                tone(noteFreq(name), dur * 0.9, tr.next, ty, tr.vol, musicGain);
            }
            tr.next += dur;
            tr.i = (tr.i + 1) % tr.seq.length;
        }
    }
    // hats fade out at night for a calmer feel
    var hguard = 0;
    while (MUS.hatTime < ahead && hguard < 32)
    {
        hguard++;
        if (MUS.night < 0.5)
        {
            hat(MUS.hatTime);
        }
        MUS.hatTime += MUS.step * 2;
    }
}


// Aquarium Story - DOM UI: HUD, panels, modals, toasts
// All comments ASCII only.

var MODE = { kind: 'normal', build: null, ghost: null };
var modalQueue = [];
var modalShowing = false;
// object whose effect range is being shown on the map (set by openObjectModal)
var INSPECT = null;

function $(id)
{
    return document.getElementById(id);
}

function fmt(n)
{
    return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// ---------- toast ----------
function showToast(msg)
{
    var wrap = $('toastWrap');
    if (!wrap)
    {
        return;
    }
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function ()
    {
        if (el.parentNode)
        {
            el.parentNode.removeChild(el);
        }
    }, 2600);
    while (wrap.children.length > 3)
    {
        wrap.removeChild(wrap.firstChild);
    }
}

// ---------- modal queue ----------
function queueModal(cfg)
{
    modalQueue.push(cfg);
    if (!modalShowing)
    {
        nextModal();
    }
}

function nextModal()
{
    var dim = $('dim');
    var host = $('modalHost');
    if (modalQueue.length === 0)
    {
        modalShowing = false;
        PAUSED = false;
        INSPECT = null;
        dim.style.display = 'none';
        host.innerHTML = '';
        return;
    }
    modalShowing = true;
    PAUSED = true;
    var cfg = modalQueue.shift();
    dim.style.display = 'block';
    host.innerHTML = '';
    var m = document.createElement('div');
    m.className = 'modal';
    var head = document.createElement('div');
    head.className = 'panelHead';
    head.textContent = cfg.title || '';
    m.appendChild(head);
    var body = document.createElement('div');
    body.className = 'panelBody';
    body.innerHTML = cfg.body || '';
    m.appendChild(body);
    var row = document.createElement('div');
    row.className = 'btnRow';
    var buttons = cfg.buttons || [{ label: '확인', cls: '' }];
    for (var i = 0; i < buttons.length; i++)
    {
        (function (bcfg)
        {
            var b = document.createElement('button');
            b.className = 'btn ' + (bcfg.cls || '');
            b.textContent = bcfg.label;
            b.addEventListener('click', function ()
            {
                sfx('click');
                if (bcfg.onClick)
                {
                    bcfg.onClick();
                }
                nextModal();
                updateHUD();
            });
            row.appendChild(b);
        })(buttons[i]);
    }
    m.appendChild(row);
    host.appendChild(m);
    if (cfg.onRender)
    {
        cfg.onRender(body, function () { nextModal(); updateHUD(); });
    }
}

    var t3 = document.createElement('button');

    t1.addEventListener('click', function () { sfx('click'); openBuildPanel('tank'); });
    t2.addEventListener('click', function () { sfx('click'); openBuildPanel('fac'); });
    t3.addEventListener('click', function () { sfx('click'); openBuildPanel('floor'); });
    tabs.appendChild(t1);
    tabs.appendChild(t2);
    tabs.appendChild(t3);
    sh.root.insertBefore(tabs, sh.body);

    if (tab === 'floor')
    {
        fillFloorTab(sh.body);

    }

    var list = (tab === 'fac') ? BUILD_ORDER_FAC : BUILD_ORDER_TANK;
    for (var i = 0; i < list.length; i++)
    {
        (function (type)
        {
            var b = BUILD[type];
            var reqLocked = b.reqLock && S.facUnlocked.indexOf(type) < 0;
            var locked = S.level < b.lvReq || reqLocked;
            var card = document.createElement('div');
            card.className = 'card' + (locked ? ' locked' : '');
            var img = document.createElement('img');
            img.className = 'icon';
            img.src = iconForBuild(type);
            card.appendChild(img);
            var mid = document.createElement('div');
            mid.className = 'mid';
            var lockTxt = '';
            if (reqLocked)
            {
                lockTxt = ' · <b>🔒 의뢰 보상으로 해금</b>';
            }
            else
            {
                if (S.level < b.lvReq)
                {
                    lockTxt = ' · ' + starStr(b.lvReq) + ' 필요';
                }
            }
            mid.innerHTML = '<div class="nm">' + b.name + ' <span class="small">(' + b.w + '×' + b.h + ')</span></div>' +
                '<div class="sub">' + b.desc + '</div>' +
                '<div class="sub">💰' + fmt(b.cost) + 'G · 유지비 ' + b.maint + 'G/월' + lockTxt + '</div>';
            card.appendChild(mid);
            var act = document.createElement('div');
            act.className = 'act';
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = '건설';
            btn.disabled = locked;
            btn.addEventListener('click', function ()
            {
                sfx('click');
                if (S.money < b.cost)
                {
                    showToast('자금이 부족합니다');
                    return;
                }
                MODE = { kind: 'place', build: type, ghost: null, armedTile: null, rot: false };
                closePanel();
                $('placeBar').style.display = 'flex';
                $('btnPlaceRotate').style.display = canRotate(type) ? 'inline-block' : 'none';
                setPlaceBarText(false);
            });
            act.appendChild(btn);
            card.appendChild(act);
            sh.body.appendChild(card);
        })(list[i]);
    }

    // expansion card
    if (S.expansion < EXPANSIONS.length)

// human-readable name for one combo requirement
function comboReqName(req)
{
    if (req.type)
    {
        return '「' + BUILD[req.type].name + '」';
    }
    if (req.species)
    {
        return '「' + SPECIES[req.species].name + '」 전시';
    }
    if (req.cls)
    {
        return THEME.text.clsNames[req.cls].replace('~', '') + ' 이상에 전시';
    }
    return '?';
}
