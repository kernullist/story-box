// ---------- save code modals ----------
function showExportModal()
{
    var code = exportCode();
    if (!code)
    {
        showToast('코드 생성에 실패했습니다');
        return;
    }
    queueModal({
        title: '📤 세이브 코드',
        body: '<div style="text-align:center;" class="small">이 코드를 복사해서 메모해 두면<br>다른 기기에서도 이어할 수 있어요!</div>' +
            '<textarea id="expArea" class="codeArea selectable" readonly></textarea>' +
            '<div style="text-align:center;margin-top:6px;"><button class="btn blue" id="btnCopyCode">📋 복사하기</button></div>',
        buttons: [{ label: '닫기', cls: 'gray' }],
        onRender: function (bodyEl)
        {
            var area = bodyEl.querySelector('#expArea');
            area.value = code;
            bodyEl.querySelector('#btnCopyCode').addEventListener('click', function ()
            {
                area.focus();
                area.select();
                area.setSelectionRange(0, code.length);
                var done = false;
                try
                {
                    done = document.execCommand('copy');
                }
                catch (e)
                {
                }
                if (!done && navigator.clipboard)
                {
                    navigator.clipboard.writeText(code).then(function ()
                    {
                        showToast('복사 완료!');
                    }, function ()
                    {
                        showToast('길게 눌러 직접 복사해 주세요');
                    });
                    return;
                }
                showToast(done ? '복사 완료!' : '길게 눌러 직접 복사해 주세요');
            });
        }
    });
}

// concrete effect lines (exact numbers and ranges) for a facility
function facEffectLines(b)
{
    var lines = [];
    if (b.need)
    {
        var l = '🙂 손님의 <b>' + NEED_LABEL[b.need] + '</b> 해결 (만족 +3)';
        if (b.sell > 0)
        {
            l += ' · 이용 시 <b>+' + b.sell + 'G</b>';
        }
        lines.push(l);
        if (b.rest)
        {
            lines.push('💤 피로도 함께 회복');
        }
    }
    if (b.aura)
    {
        lines.push('✨ <b>주변 2칸</b> 안의 ' + THEME.text.enclosureWord + ' 매력 <b>+' + b.aura + '</b>씩 (합계 최대 +8)');
    }
    if (b.fun)
    {
        lines.push('🎉 손님 만족 <b>+8</b> · 이용료 <b>+' + b.sell + 'G</b> · 가끔 인기 +1');
    }
    if (b.gift)
    {
        lines.push('🎁 손님이 나가기 전에 들러요 · 구매 시 <b>+' + b.sell + 'G</b>, 만족 +6');
    }
    if (b.stage)
    {
        lines.push('🎤 공연 개최 가능 (쿨다운 6일) · 근처 손님이 <b>공연료 80G</b>씩 내고 만족 +12');
    }
    return lines;
}

                    });
                    act.appendChild(btn);

                })(SPECIES_ORDER[i]);

// ---------- HUD ----------
function updateHUD()
{
    if (!S)
    {
        return;
    }
    $('hudMoney').textContent = fmt(S.money) + 'G';
    $('hudRpIco').textContent = THEME.rpIcon;
    $('hudRp').textContent = fmt(S.rp) + 'P';
    $('hudFame').textContent = fmt(S.fame);
    $('hudVis').textContent = VISITORS.length + '명';
    var seasonIcon = SEASONS[seasonOf(S.month)].icon;
    if (S.opened)
    {
        // time-of-day icon follows the ambient light cycle
        var phase = (nightFactor() > 0.5) ? '🌙' : ((duskFactor() > 0.3) ? '🌆' : '☀️');
        var pauseTag = (PAUSED || PANEL_OPEN || MODE.kind !== 'normal') ? '⏸ ' : '';
        $('hudDate').textContent = pauseTag + phase + seasonIcon + ' ' + S.year + '년차 ' + S.month + '월 ' + S.day + '일';
    }
    else
    {
        $('hudDate').textContent = '🔨 개장 준비중';
    }
    $('hudLv').textContent = starStr(S.level);
    $('btnSpeed').textContent = '▶×' + S.speed;
    var ob = $('openBtn');
    if (ob)
    {
        // hide the open button whenever something covers the play area:
        // a modal, an open bottom panel, or active placement mode
        var panelOpen = $('panelHost').children.length > 0;
        var show = !S.opened && !modalShowing && !panelOpen && MODE.kind === 'normal';
        ob.style.display = show ? 'block' : 'none';
    }
    var ts = $('tbSpecial');
    if (ts)
    {
        ts.style.display = (THEME.specials) ? 'block' : 'none';
    }
    $('tbResearch').textContent = THEME.text.tbResearch;
    var qc = $('questChip');
    if (qc)
    {
        var q = currentQuest();
        if (q && !modalShowing && MODE.kind === 'normal')
        {
            var p = q.prog ? (' (' + q.prog(S) + ')') : '';
            qc.textContent = '📌 ' + q.name + p;
            qc.style.display = 'block';
        }
        else
        {
            qc.style.display = 'none';
        }
    }
}

// begin moving an already-placed object: lift it off the grid so it
// doesn't collide with itself, then enter a move-preview mode
function startMove(o)
{
    var idx = S.objects.indexOf(o);
    if (idx < 0)
    {
        return;
    }
    S.objects.splice(idx, 1);
    rebuildGrid();
    repathAll();
    MODE = {
        kind: 'move', moveObj: o, build: o.type, ghost: { tx: o.x, ty: o.y },
        armedTile: null, rot: !!o.rot, origX: o.x, origY: o.y, origRot: !!o.rot
    };
    $('placeBar').style.display = 'flex';
    $('btnPlaceRotate').style.display = canRotate(o.type) ? 'inline-block' : 'none';
    setPlaceBarText(false);
}

function cancelPlaceMode()
{
    // if a move was in progress, drop the lifted object back where it was
    if (MODE.kind === 'move' && MODE.moveObj)
    {
        var o = MODE.moveObj;
        o.x = MODE.origX;
        o.y = MODE.origY;
        o.rot = MODE.origRot;
        S.objects.push(o);
        rebuildGrid();
        repathAll();
    }
    MODE = { kind: 'normal', build: null, ghost: null, armedTile: null };
    $('placeBar').style.display = 'none';
}

// rotate the piece being placed/moved 90 degrees; re-arms confirmation
function rotateGhost()
{
    if ((MODE.kind !== 'place' && MODE.kind !== 'move') || !MODE.build || !canRotate(MODE.build))
    {
        return;
    }
    MODE.rot = !MODE.rot;
    MODE.armedTile = null;
    sfx('click');
    setPlaceBarText(false);
}

// place bar prompt: armed=true after the first tap (awaiting confirmation)
function setPlaceBarText(armed)
{
    if (MODE.kind === 'floor')
    {
        var fn = (MODE.build === 'erase') ? '🧽 지우개' : FLOORS[MODE.build].name;
        $('placeName').innerHTML = fn + ' — <b>끌어서</b> 칠하기!';
        return;
    }
    if ((MODE.kind !== 'place' && MODE.kind !== 'move') || !MODE.build)
    {
        return;
    }
    var nm = BUILD[MODE.build].name;
    var moving = (MODE.kind === 'move');
    if (armed)
    {
        $('placeName').innerHTML = '<b style="color:#ffe060;">여기로 ' + (moving ? '이동' : '건설') + '?</b> 한 번 더 탭!';
    }
    else
    {
        $('placeName').innerHTML = nm + (moving ? ' 이동' : ' 배치') + ' — <b>끌어서</b> 놓거나 탭!';
    }
}


// Aquarium Story - render loop, input, boot
// All comments ASCII only.

var cv = null;
var ctx = null;
var lastT = 0;
// always-running clock for UI pulses (ghost highlight etc.) even while
// the sim itself is paused
var UI_TIME = 0;

function setupCanvas()
{
    cv = document.getElementById('cv');
    cv.width = MAP_W * TS;
    cv.height = MAP_H * TS + WALL_H;
    ctx = cv.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas()
{
    var wrap = document.getElementById('canvasWrap');
    var ww = wrap.clientWidth - 8;
    var wh = wrap.clientHeight - 8;
    var scale = Math.min(ww / cv.width, wh / cv.height);
    cv.style.width = Math.floor(cv.width * scale) + 'px';
    cv.style.height = Math.floor(cv.height * scale) + 'px';
}

function canvasTileFromEvent(e)
{
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * cv.width;
    var y = (e.clientY - r.top) / r.height * cv.height - WALL_H;
    return { tx: Math.floor(x / TS), ty: Math.floor(y / TS), px: x, py: y };
}

// ---------- rendering ----------
// decorative wall band across the top of the venue (drawn in canvas space)
function drawWall()
{
    var w = THEME.wall;
    ctx.fillStyle = w.top;
    ctx.fillRect(0, 0, cv.width, 7);
    ctx.fillStyle = w.face;
    ctx.fillRect(0, 7, cv.width, WALL_H - 10);
    ctx.fillStyle = w.trim;
    ctx.fillRect(0, WALL_H - 3, cv.width, 3);
    // theme pattern on the wall face
    if (THEME.floorStyle === 'tile')
    {
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        for (var b = 0; b < 9; b++)
        {
            var bx = (b * 73 + 20) % cv.width;
            var by = 11 + (b * 5) % 9;
            ctx.beginPath();
            ctx.arc(bx, by, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    if (THEME.floorStyle === 'wood')
    {
        ctx.fillStyle = 'rgba(255,220,170,0.35)';
        for (var p = 0; p < 7; p++)
        {
            var pxw = 30 + p * 96;
            ctx.fillRect(pxw, 13, 3, 3);
            ctx.fillRect(pxw + 5, 10, 3, 3);
            ctx.fillRect(pxw + 10, 13, 3, 3);
        }
    }
    if (THEME.floorStyle === 'marble')
    {
        ctx.fillStyle = 'rgba(255,240,200,0.25)';
        for (var m = 0; m < 6; m++)
        {
            ctx.fillRect(40 + m * 110, 9, 2, WALL_H - 14);
        }
    }
    // venue sign with the owner's name
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    var sx = cv.width / 2;
    var sy = WALL_H - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(THEME.wallSign, sx + 1, sy + 1);
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(THEME.wallSign, sx, sy);
    ctx.textAlign = 'left';
}

function renderGround()
{
    var uw = usableW();
    var style = THEME.floorStyle;
    var x;
    var y;
    for (y = 0; y < MAP_H; y++)
    {
        for (x = 0; x < uw; x++)
        {
            if (style === 'wood')
            {
                ctx.fillStyle = (y % 2 === 0) ? THEME.floorA : THEME.floorB;
            }
            else
            {
                ctx.fillStyle = ((x + y) % 2 === 0) ? THEME.floorA : THEME.floorB;
            }
            ctx.fillRect(x * TS, y * TS, TS, TS);
        }
    }
    if (style === 'wood')
    {
        // plank seams: horizontal joints, staggered vertical cuts, knots
        ctx.fillStyle = 'rgba(130,90,45,0.30)';
        for (y = 1; y <= MAP_H; y++)
        {
            ctx.fillRect(0, y * TS - 1, uw * TS, 1);
        }
        for (y = 0; y < MAP_H; y++)
        {
            for (x = 0; x < uw; x++)
            {
                var cut = ((y % 2 === 0) ? 0 : 16);
                ctx.fillRect(x * TS + cut, y * TS + 2, 1, TS - 4);
                if ((x * 13 + y * 7) % 9 === 0)
                {
                    ctx.fillRect(x * TS + 8 + (x % 3) * 6, y * TS + 10 + (y % 3) * 4, 2, 2);
                }
            }
        }
    }
    else
    {
        // grout lines
        ctx.fillStyle = (style === 'marble') ? 'rgba(140,125,95,0.22)' : 'rgba(120,150,145,0.22)';
        for (x = 1; x <= uw; x++)
        {
            ctx.fillRect(x * TS, 0, 1, MAP_H * TS);
        }
        for (y = 1; y <= MAP_H; y++)
        {
            ctx.fillRect(0, y * TS - 1, uw * TS, 1);
        }
        // accent tiles
        for (y = 0; y < MAP_H; y++)
        {
            for (x = 0; x < uw; x++)
            {
                if ((x * 31 + y * 17) % 13 === 0)
                {
                    if (style === 'tile')
                    {
                        ctx.fillStyle = 'rgba(90,170,190,0.35)';
                        ctx.fillRect(x * TS + 8, y * TS + 14, 8, 2);
                        ctx.fillRect(x * TS + 18, y * TS + 18, 8, 2);
                    }
                    else
                    {
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fillRect(x * TS + 6, y * TS + 20, 12, 2);
                        ctx.fillRect(x * TS + 14, y * TS + 10, 10, 2);
                    }
                }
            }
        }
    }

    // painted floor tiles sit above the base floor
    for (var fk in S.floorTiles)
    {
        var parts = fk.split(',');
        var fx = parseInt(parts[0], 10);
        var fy = parseInt(parts[1], 10);
        if (fx < uw && fy < MAP_H)
        {
            drawFloorTile(ctx, S.floorTiles[fk], fx * TS, fy * TS);
        }
    }

    // locked expansion zone: construction site
    if (uw < MAP_W)
    {
        for (y = 0; y < MAP_H; y++)
        {
            for (x = uw; x < MAP_W; x++)
            {
                ctx.fillStyle = ((x + y) % 2 === 0) ? '#dcc9a0' : '#d5c194';
                ctx.fillRect(x * TS, y * TS, TS, TS);
            }
        }
        // barrier stripe along the boundary
        for (y = 0; y < MAP_H * TS; y += 12)
        {
            ctx.fillStyle = (Math.floor(y / 12) % 2 === 0) ? '#f0c020' : '#3a3a3a';
            ctx.fillRect(uw * TS - 3, y, 6, 12);
        }
        // scattered crates and cones
        var lockedW = MAP_W - uw;
        for (var d = 0; d < lockedW * 3; d++)
        {
            var dx = uw + (d * 7) % lockedW;
            var dy = (d * 5 + 2) % MAP_H;
            var wx2 = dx * TS + 8;
            var wy2 = dy * TS + 8;
            if (d % 3 === 0)
            {
                ctx.fillStyle = '#b08850';
                ctx.fillRect(wx2, wy2, 14, 12);
                ctx.fillStyle = '#8a6838';
                ctx.fillRect(wx2, wy2 + 5, 14, 2);
                ctx.fillRect(wx2 + 6, wy2, 2, 12);
            }
            else
            {
                if (d % 3 === 1)
                {
                    ctx.fillStyle = '#e86830';
                    ctx.fillRect(wx2 + 5, wy2 + 2, 4, 8);
                    ctx.fillRect(wx2 + 3, wy2 + 10, 8, 3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(wx2 + 5, wy2 + 5, 4, 2);
                }
            }
        }
        // signboard
        var sbx = (uw + (MAP_W - uw) / 2) * TS;
        var sby = MAP_H * TS / 2;
        ctx.fillStyle = '#8a6838';
        ctx.fillRect(sbx - 2, sby - 4, 4, 26);
        ctx.fillStyle = '#f5ead0';
        ctx.fillRect(sbx - 42, sby - 22, 84, 20);
        ctx.strokeStyle = '#7a5a30';
        ctx.lineWidth = 2;
        ctx.strokeRect(sbx - 42, sby - 22, 84, 20);
        ctx.fillStyle = '#7a5a30';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('확장 예정지', sbx, sby - 8);
        ctx.textAlign = 'left';
    }

    // entrance: carpet path and gate
    var ex = ENTRANCE.x * TS;
    var ey = ENTRANCE.y * TS;
    ctx.fillStyle = '#c84838';
    ctx.fillRect(ex + 2, ey - TS + 4, TS - 4, TS * 2 - 4);
    ctx.fillStyle = '#e06858';
    ctx.fillRect(ex + 5, ey - TS + 7, TS - 10, TS * 2 - 10);
    ctx.fillStyle = '#ffd7a0';
    ctx.fillRect(ex + 2, ey - TS + 4, TS - 4, 2);
    // gate posts and beam
    ctx.fillStyle = '#3a5a70';
    ctx.fillRect(ex - 7, ey + 2, 7, TS - 2);
    ctx.fillRect(ex + TS, ey + 2, 7, TS - 2);
    ctx.fillStyle = '#4a7290';
    ctx.fillRect(ex - 7, ey + 2, 7, 4);
    ctx.fillRect(ex + TS, ey + 2, 7, 4);
    ctx.fillStyle = '#d04838';
    ctx.fillRect(ex - 7, ey - 4, TS + 14, 7);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('WELCOME', ex + TS / 2, ey + 2);
    ctx.textAlign = 'left';
}

// draw one dashed effect-zone rectangle, clipped to the usable map
function drawZoneRect(px0, py0, pw, ph, fill, stroke)
{
    var maxW = usableW() * TS;
    var maxH = MAP_H * TS;
    var cx0 = Math.max(0, px0);
    var cy0 = Math.max(0, py0);
    var cx1 = Math.min(maxW, px0 + pw);
    var cy1 = Math.min(maxH, py0 + ph);
    if (cx1 <= cx0 || cy1 <= cy0)
    {
        return;
    }
    ctx.fillStyle = fill;
    ctx.fillRect(cx0, cy0, cx1 - cx0, cy1 - cy0);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(cx0 + 1, cy0 + 1, cx1 - cx0 - 2, cy1 - cy0 - 2);
    ctx.setLineDash([]);
}

// highlight the exact effect areas of the inspected / placed object:
// purple = spot combo range (4 tiles), green = decoration aura (2 tiles),
// blue = show stage reach, amber = where decorations boost this exhibit
function drawRangeOverlay()
{
    var x = 0;
    var y = 0;
    var w = 1;
    var h = 1;
    var type = null;
    var species = null;
    // floor painting: just highlight the tile under the cursor
    if (MODE.kind === 'floor' && MODE.ghost)
    {
        var okPaint = canPaintFloor(MODE.ghost.tx, MODE.ghost.ty);
        drawZoneRect(MODE.ghost.tx * TS, MODE.ghost.ty * TS, TS, TS,
            okPaint ? 'rgba(80,200,120,0.28)' : 'rgba(240,80,80,0.28)',
            okPaint ? 'rgba(40,160,90,0.9)' : 'rgba(200,60,60,0.9)');
        return;
    }
    if ((MODE.kind === 'place' || MODE.kind === 'move') && MODE.ghost)
    {
        type = MODE.build;
        x = MODE.ghost.tx;
        y = MODE.ghost.ty;
        w = ftW(type, MODE.rot);
        h = ftH(type, MODE.rot);
        species = MODE.moveObj ? MODE.moveObj.species : null;
    }
    else
    {
        if (INSPECT && S.objects.indexOf(INSPECT) >= 0)
        {
            type = INSPECT.type;
            x = INSPECT.x;
            y = INSPECT.y;
            w = oW(INSPECT);
            h = oH(INSPECT);
            species = INSPECT.species || null;
        }
    }
    if (!type)
    {
        return;
    }
    var b = BUILD[type];
    // spot combo range first (largest, so smaller zones draw on top).
    // combo rule: member top-left corners within COMBO_RANGE tiles
    if (inAnyCombo(type, species))
    {
        var cr = COMBO_RANGE;
        drawZoneRect((x - cr) * TS, (y - cr) * TS, (cr * 2 + 1) * TS, (cr * 2 + 1) * TS,
            'rgba(190,110,235,0.13)', 'rgba(165,80,215,0.8)');
    }
    if (b.stage)
    {
        // show reach: visitors within 4.5 tiles of the stage center
        drawZoneRect(((x + w / 2) - 4.5) * TS, ((y + h / 2) - 4.5) * TS, 9 * TS, 9 * TS,
            'rgba(80,160,255,0.16)', 'rgba(60,130,230,0.75)');
    }
    if (b.aura)
    {
        drawZoneRect((x - 2) * TS, (y - 2) * TS, 5 * TS, 5 * TS,
            'rgba(80,200,120,0.20)', 'rgba(40,160,90,0.75)');
    }
    if (b.kind === 'tank')
    {
        drawZoneRect((x - 2) * TS, (y - 2) * TS, 5 * TS, 5 * TS,
            'rgba(255,190,60,0.16)', 'rgba(215,155,40,0.75)');
    }
}

function renderWorld()
{
    drawWall();
    ctx.save();
    ctx.translate(0, WALL_H);
    renderGround();
    drawRangeOverlay();

    // build sortable draw list
    var items = [];
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        var b = BUILD[o.type];
        items.push({ sy: (o.y + b.h) * TS, obj: o });
    }
    for (var v = 0; v < VISITORS.length; v++)
    {
        items.push({ sy: VISITORS[v].y + 6, vis: VISITORS[v] });
    }
    items.sort(function (a, b2) { return a.sy - b2.sy; });
    for (var d = 0; d < items.length; d++)
    {
        if (items[d].obj)
        {
            drawObject(ctx, items[d].obj, GAME_TIME);
        }
        else
        {
            drawVisitor(ctx, items[d].vis, items[d].vis.x, items[d].vis.y);
        }
    }

    // seasonal particles (petals / leaves / snow)
    var season = seasonOf(S.month);
    if (season !== 'summer' && S.opened)
    {
        var pcol = (season === 'spring') ? '#ffb8d8' : (season === 'autumn') ? '#e8933a' : '#ffffff';
        ctx.fillStyle = pcol;
        var uw2 = usableW() * TS;
        for (var pi = 0; pi < 14; pi++)
        {
            var spd = 14 + (pi % 4) * 6;
            var px2 = ((pi * 97) % uw2) + Math.sin(GAME_TIME * 0.9 + pi) * 22;
            var py2 = ((pi * 53 + GAME_TIME * spd) % (cv.height + 16)) - 8;
            ctx.globalAlpha = 0.75;
            ctx.fillRect(px2, py2, 3, 3);
            ctx.globalAlpha = 1;
        }
    }

    // feeding time indicator (aquarium)
    if (FEED)
    {
        var fo = getObj(FEED.objId);
        if (fo)
        {
            var fb = BUILD[fo.type];
            var bounce = Math.sin(GAME_TIME * 7) * 3;
            var pulse = 0.5 + Math.abs(Math.sin(GAME_TIME * 5)) * 0.5;
            ctx.strokeStyle = 'rgba(255,210,40,' + pulse + ')';
            ctx.lineWidth = 3;
            ctx.strokeRect(fo.x * TS + 1, fo.y * TS + 1, fb.w * TS - 2, fb.h * TS - 2);
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🍴', (fo.x + fb.w / 2) * TS, fo.y * TS - 6 + bounce);
            ctx.textAlign = 'left';
        }
    }

    // placement / move ghost
    if ((MODE.kind === 'place' || MODE.kind === 'move') && MODE.ghost)
    {
        var gx = MODE.ghost.tx;
        var gy = MODE.ghost.ty;
        var gw = ftW(MODE.build, MODE.rot) * TS;
        var gh = ftH(MODE.build, MODE.rot) * TS;
        var err = placeError(MODE.build, gx, gy, MODE.rot);
        var armed = MODE.armedTile && MODE.armedTile.tx === gx && MODE.armedTile.ty === gy && !err;
        ctx.globalAlpha = armed ? 0.35 : 0.55;
        ctx.fillStyle = err ? '#f04040' : '#40d060';
        ctx.fillRect(gx * TS, gy * TS, gw, gh);
        if (!err)
        {
            var mo = MODE.moveObj;
            var fake = mo
                ? { type: MODE.build, x: gx, y: gy, species: mo.species, lv: mo.lv, rot: MODE.rot, mood: mo.mood }
                : { type: MODE.build, x: gx, y: gy, species: null, lv: 1, rot: MODE.rot };
            drawObject(ctx, fake, GAME_TIME);
        }
        ctx.globalAlpha = 1;
        // pulsing confirm border on the armed tile (UI clock: keeps
        // pulsing even while the sim is paused for placement)
        if (armed)
        {
            var pulse = 0.5 + Math.abs(Math.sin(UI_TIME * 5)) * 0.5;
            ctx.strokeStyle = 'rgba(255,210,40,' + pulse.toFixed(2) + ')';
            ctx.lineWidth = 3;
            ctx.strokeRect(gx * TS + 1, gy * TS + 1, gw - 2, gh - 2);
            ctx.font = '15px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('👆', gx * TS + gw / 2, gy * TS - 4 + Math.sin(UI_TIME * 6) * 2);
            ctx.textAlign = 'left';
        }
    }

    // construction dust
    for (var pf = 0; pf < PUFFS.length; pf++)
    {
        var pp = PUFFS[pf];
        ctx.globalAlpha = Math.max(0, 0.55 * (1 - pp.t / 0.55));
        ctx.fillStyle = '#d8cbb2';
        ctx.beginPath();
        ctx.arc(pp.x, pp.y - pp.t * 12, pp.r + pp.t * 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // emotes
    for (var e = 0; e < EMOTES.length; e++)
    {
        var em = EMOTES[e];
        ctx.globalAlpha = Math.max(0, 1 - em.t / 1.1);
        drawEmote(ctx, em.kind, em.x, em.y - em.t * 14);
        ctx.globalAlpha = 1;
    }

    // floating texts
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    for (var f = 0; f < FLOATS.length; f++)
    {
        var fl = FLOATS[f];
        ctx.globalAlpha = Math.max(0, 1 - fl.t / 1.6);
        ctx.fillStyle = '#3a2408';
        ctx.fillText(fl.text, fl.x + 1, fl.y - fl.t * 20 + 1);
        ctx.fillStyle = fl.color;
        ctx.fillText(fl.text, fl.x, fl.y - fl.t * 20);
        ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';

    drawAmbientLight();
    ctx.restore();

    // event banners on the wall band, stacked so they never overlap
    var bannerY = WALL_H + 3;
    if (S.specialEx)
    {
        var plan = getSpecialPlan(S.specialEx.id);
        if (plan)
        {
            drawBanner('📜 ' + plan.name + ' 개최 중! (' + S.specialEx.days + '일)', bannerY, 'rgba(160,60,120,0.9)');
            bannerY += 22;
        }
    }
    if (S.groupBurst > 0)
    {
        drawBanner('🎒 단체 손님이 몰려오는 중!', bannerY, 'rgba(40,120,80,0.9)');
    }
}

function drawBanner(text, y, bg)
{
    ctx.font = 'bold 11px sans-serif';
    var bw = ctx.measureText(text).width + 24;
    ctx.fillStyle = bg;
    roundRect(ctx, cv.width / 2 - bw / 2, y, bw, 18, 8);
    ctx.fill();
    ctx.fillStyle = '#ffe9b0';
    ctx.textAlign = 'center';
    ctx.fillText(text, cv.width / 2, y + 13);
    ctx.textAlign = 'left';
}

// day -> dusk -> night -> dawn ambience on a slow real-time loop (60s)
// factors are shared with the music mood engine (nightFactor/duskFactor)
function drawAmbientLight()
{
    var dusk = duskFactor();
    var night = nightFactor();
    var mw = MAP_W * TS;
    var mh = MAP_H * TS;
    if (dusk > 0)
    {
        ctx.fillStyle = 'rgba(255,130,50,' + (0.13 * dusk).toFixed(3) + ')';
        ctx.fillRect(0, 0, mw, mh);
    }
    if (night > 0)
    {
        ctx.fillStyle = 'rgba(18,28,66,' + (0.34 * night).toFixed(3) + ')';
        ctx.fillRect(0, 0, mw, mh);
        // exhibits glow softly in the dark
        for (var i = 0; i < S.objects.length; i++)
        {
            var o = S.objects[i];
            var b = BUILD[o.type];
            if (b.kind !== 'tank' || !o.species)
            {
                continue;
            }
            var gx = (o.x + b.w / 2) * TS;
            var gy = (o.y + b.h / 2) * TS;
            var gr = Math.max(b.w, b.h) * TS * 0.9;
            var grad = ctx.createRadialGradient(gx, gy, 4, gx, gy, gr);
            var glowCol = (THEME.id === 'aqua') ? '140,215,255' : '255,205,120';
            grad.addColorStop(0, 'rgba(' + glowCol + ',' + (0.16 * night).toFixed(3) + ')');
            grad.addColorStop(1, 'rgba(' + glowCol + ',0)');
            ctx.fillStyle = grad;
            ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
        }
        // entrance lamp
        var ex = (ENTRANCE.x + 0.5) * TS;
        var ey = ENTRANCE.y * TS;
        var lg = ctx.createRadialGradient(ex, ey, 3, ex, ey, 70);
        lg.addColorStop(0, 'rgba(255,220,140,' + (0.22 * night).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(255,220,140,0)');
        ctx.fillStyle = lg;
        ctx.fillRect(ex - 70, ey - 70, 140, 140);
    }
}

// ---------- input ----------
// paint the currently selected floor tile at a map position
function paintFloorAt(t)
{
    if (t.ty < 0)
    {
        return;
    }
    if (paintFloor(t.tx, t.ty, MODE.build))
    {
        sfx('click');
    }
}

// place or move the current piece at (tx,ty). returns true if it committed.
function commitPlacement(tx, ty)
{
    MODE.armedTile = null;
    setPlaceBarText(false);
    if (MODE.kind === 'move')
    {
        if (commitMove(tx, ty, MODE.rot))
        {
            MODE = { kind: 'normal', build: null, ghost: null, armedTile: null };
            document.getElementById('placeBar').style.display = 'none';
            updateHUD();
            return true;
        }
        return false;
    }
    var o = placeObject(MODE.build, tx, ty, MODE.rot);
    if (o)
    {
        updateHUD();
        var b = BUILD[MODE.build];
        if (S.money < b.cost)
        {
            cancelPlaceMode();
        }
        if (b.kind === 'tank')
        {
            cancelPlaceMode();
            openObjectModal(o);
        }
        return true;
    }
    return false;
}

// two-tap flow: first tap arms a preview, second tap on the same tile commits
function handleTapConfirm(t)
{
    var armed = MODE.armedTile && MODE.armedTile.tx === t.tx && MODE.armedTile.ty === t.ty;
    if (!armed)
    {
        MODE.armedTile = { tx: t.tx, ty: t.ty };
        var err = placeError(MODE.build, t.tx, t.ty, MODE.rot);
        if (err)
        {
            showToast(err);
        }
        else
        {
            sfx('click');
        }
        setPlaceBarText(true);
        return;
    }
    commitPlacement(t.tx, t.ty);
}

var ptDown = false;
var ptStart = null;
var ptDragged = false;

function bindInput()
{
    cv.addEventListener('pointerdown', function (e)
    {
        e.preventDefault();
        initAudio();
        var t = canvasTileFromEvent(e);
        if (t.ty < 0)
        {
            return;
        }
        if (MODE.kind === 'floor')
        {
            // floors paint immediately and keep painting while dragging
            ptDown = true;
            MODE.ghost = t;
            paintFloorAt(t);
            try
            {
                cv.setPointerCapture(e.pointerId);
            }
            catch (err2)
            {
            }
            return;
        }
        if (MODE.kind === 'place' || MODE.kind === 'move')
        {
            // defer to pointerup: a tap uses the two-tap flow, a drag drops on release
            ptDown = true;
            ptDragged = false;
            ptStart = { tx: t.tx, ty: t.ty, px: e.clientX, py: e.clientY };
            MODE.ghost = t;
            try
            {
                cv.setPointerCapture(e.pointerId);
            }
            catch (err)
            {
            }
            return;
        }
        var hit = objectAt(t.tx, t.ty);
        if (hit)
        {
            if (FEED && hit.id === FEED.objId)
            {
                doFeed(hit);
                updateHUD();
                return;
            }
            sfx('click');
            openObjectModal(hit);
        }
    });

    cv.addEventListener('pointermove', function (e)
    {
        if (MODE.kind === 'floor')
        {
            var ft = canvasTileFromEvent(e);
            MODE.ghost = ft;
            if (ptDown)
            {
                paintFloorAt(ft);
            }
            return;
        }
        if (MODE.kind !== 'place' && MODE.kind !== 'move')
        {
            return;
        }
        var t = canvasTileFromEvent(e);
        MODE.ghost = t;
        if (ptDown)
        {
            // finger held down and moving: this is a drag
            var dpx = Math.abs(e.clientX - ptStart.px);
            var dpy = Math.abs(e.clientY - ptStart.py);
            if (dpx > 6 || dpy > 6 || t.tx !== ptStart.tx || t.ty !== ptStart.ty)
            {
                ptDragged = true;
                if (MODE.armedTile)
                {
                    MODE.armedTile = null;
                    setPlaceBarText(false);
                }
            }
        }
        else
        {
            // hover (mouse, no button): disarm if the preview left the armed tile
            if (MODE.armedTile && (MODE.armedTile.tx !== t.tx || MODE.armedTile.ty !== t.ty))
            {
                MODE.armedTile = null;
                setPlaceBarText(false);
            }
        }
    });

    cv.addEventListener('pointerup', function (e)
    {
        if (!ptDown)
        {
            return;
        }
        ptDown = false;
        if (MODE.kind === 'floor')
        {
            try
            {
                cv.releasePointerCapture(e.pointerId);
            }
            catch (err3)
            {
            }
            updateHUD();
            return;
        }
        try
        {
            cv.releasePointerCapture(e.pointerId);
        }
        catch (err)
        {
        }
        if (MODE.kind !== 'place' && MODE.kind !== 'move')
        {
            return;
        }
        var t = canvasTileFromEvent(e);
        if (t.ty < 0)
        {
            ptDragged = false;
            return;
        }
        MODE.ghost = t;
        if (ptDragged)
        {
            // drag-drop: release confirms placement at this tile
            ptDragged = false;
            commitPlacement(t.tx, t.ty);
            return;
        }
        handleTapConfirm(t);
    });

    cv.addEventListener('pointercancel', function ()
    {
        ptDown = false;
        ptDragged = false;
    });

    document.addEventListener('contextmenu', function (e)
    {
        e.preventDefault();
    });
}

// ---------- main loop ----------
function frame(t)
{
    var dt = t - lastT;
    lastT = t;
    if (dt > 100)
    {
        dt = 100;
    }
    UI_TIME += dt / 1000;
    if (S)
    {
        // pause while a modal, a system panel, or placement mode is active
        if (!PAUSED && !PANEL_OPEN && MODE.kind === 'normal')
        {
            advanceSim(dt * S.speed);
        }
        else
        {
            // keep cosmetic particles (dust, floats) animating while paused
            updateFx(dt / 1000);
        }
        renderWorld();
        updateHUD();
    }
    requestAnimationFrame(frame);
}

        }
    });
    document.getElementById('openBtn').addEventListener('click', function ()
    {
        initAudio();
        tryOpenPark();
    });
    document.getElementById('questChip').addEventListener('click', function ()
    {
        initAudio();
        sfx('click');
        showQuestDetail();
    });
    document.getElementById('btnNew').addEventListener('click', function ()
    {
        if (hasSave())
        {
            queueModal({
                title: '⚠️ 새 게임',
                body: '<div style="text-align:center;">저장된 게임이 있습니다.<br>처음부터 시작하면 다음 자동 저장 때<br>기존 데이터가 덮어써져요. 괜찮을까요?</div>',
                buttons: [
                    { label: '처음부터', cls: 'red', onClick: function () { startGame(false); } },
                    { label: '취소', cls: 'gray' }
                ]
            });
        }
        else
        {
            startGame(false);
        }
    });
    document.getElementById('btnContinue').addEventListener('click', function () { startGame(true); });
    document.getElementById('btnBackLauncher').addEventListener('click', function ()
    {
        sfx('click');
        showLauncher();
    });

    document.addEventListener('visibilitychange', function ()
    {
        lastT = performance.now();
        if (!document.hidden)
        {
            initAudio();
        }
    });

    // any first tap anywhere unlocks/resumes audio (iOS requirement)
    document.addEventListener('pointerdown', audioUnlockTap, true);

    showLauncher();
    requestAnimationFrame(function (t)
    {
        lastT = t;
        requestAnimationFrame(frame);
    });
}

window.addEventListener('load', boot);

</script>
</body>
</html>
