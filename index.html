<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>스토리 박스</title>
<style>
/* Aquarium Story - Kairosoft style UI */
*
{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body
{
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    background: #2a6f8e;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-weight: 700;
}

#game
{
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #2a6f8e;
}

/* ---------- HUD top bar ---------- */
#hud
{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: linear-gradient(#5ea9c8, #3f88a8);
    border-bottom: 3px solid #1d4a60;
    color: #fff;
    font-size: 13px;
    flex-wrap: wrap;
    z-index: 20;
}

.hudItem
{
    background: rgba(10, 40, 60, 0.55);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    padding: 2px 8px;
    white-space: nowrap;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
}

.hudItem .ico
{
    margin-right: 3px;
}

#hudDate
{
    margin-left: auto;
}

#btnSpeed
{
    min-width: 46px;
}

/* ---------- canvas area ---------- */
#canvasWrap
{
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 30% 20%, #3d86a6 0, #2a6f8e 60%);
}

#cv
{
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #bfe3ef;
    border: 3px solid #1d4a60;
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    touch-action: none;
}

/* ---------- bottom toolbar ---------- */
#toolbar
{
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: linear-gradient(#5ea9c8, #3f88a8);
    border-top: 3px solid #1d4a60;
    z-index: 20;
}

.tbBtn
{
    flex: 1;
    padding: 9px 2px;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    color: #5a3200;
    background: linear-gradient(#ffd76e, #ffb43a);
    border: 3px solid #8a5a10;
    border-radius: 12px;
    box-shadow: 0 3px 0 #8a5a10;
    cursor: pointer;
}

.tbBtn:active
{
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8a5a10;
}

/* ---------- generic buttons ---------- */
.btn
{
    display: inline-block;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    color: #5a3200;
    background: linear-gradient(#ffd76e, #ffb43a);
    border: 3px solid #8a5a10;
    border-radius: 10px;
    box-shadow: 0 3px 0 #8a5a10;
    cursor: pointer;
}

.btn:active
{
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8a5a10;
}

.btn.blue
{
    color: #fff;
    background: linear-gradient(#6ec6ff, #2f96e0);
    border-color: #145a8a;
    box-shadow: 0 3px 0 #145a8a;
}

.btn.red
{
    color: #fff;
    background: linear-gradient(#ff8a7a, #e0503f);
    border-color: #8a2014;
    box-shadow: 0 3px 0 #8a2014;
}

.btn.gray
{
    color: #444;
    background: linear-gradient(#e8e8e8, #bdbdbd);
    border-color: #777;
    box-shadow: 0 3px 0 #777;
}

.btn:disabled
{
    filter: grayscale(1) brightness(0.85);
    cursor: default;
}

/* ---------- panels (bottom sheet) ---------- */
.panel
{
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(560px, 96%);
    max-height: 72%;
    background: #fff6dd;
    border: 4px solid #7a4a1a;
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    z-index: 30;
}

.panelHead
{
    display: flex;
    align-items: center;
    padding: 8px 12px;
    background: linear-gradient(#ffca5f, #ffab2e);
    border-bottom: 3px solid #7a4a1a;
    border-radius: 12px 12px 0 0;
    color: #5a3200;
    font-size: 16px;
}

.panelHead .x
{
    margin-left: auto;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: #e0503f;
    border: 3px solid #8a2014;
    border-radius: 10px;
    cursor: pointer;
}

.panelBody
{
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding: 10px;
}

.tabRow
{
    display: flex;
    gap: 6px;
    padding: 8px 10px 0;
}

.tabBtn
{
    flex: 1;
    padding: 7px 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    color: #7a5a20;
    background: #f3dfae;
    border: 3px solid #b08a3a;
    border-radius: 10px 10px 0 0;
    border-bottom: none;
    cursor: pointer;
}

.tabBtn.on
{
    color: #5a3200;
    background: #ffe9b0;
    border-color: #7a4a1a;
}

/* ---------- list cards ---------- */
.card
{
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fffdf4;
    border: 3px solid #c9a25a;
    border-radius: 12px;
    padding: 8px 10px;
    margin-bottom: 8px;
}

.card.locked
{
    filter: grayscale(0.9);
    opacity: 0.75;
}

.card .icon
{
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    image-rendering: pixelated;
    background: #dff2fb;
    border: 2px solid #9ab8c8;
    border-radius: 8px;
}

.card .mid
{
    flex: 1 1 auto;
    min-width: 0;
}

.card .nm
{
    font-size: 14px;
    color: #4a2f08;
}

.card .sub
{
    font-size: 11px;
    color: #8a6a30;
    font-weight: 600;
}

.card .act
{
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: stretch;
}

.card .act .btn
{
    padding: 6px 10px;
    font-size: 12px;
}

/* ---------- modal ---------- */
#dim
{
    position: absolute;
    inset: 0;
    background: rgba(10, 30, 45, 0.55);
    z-index: 150;
    display: none;
}

.modal
{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(480px, 92%);
    max-height: 86%;
    background: #fff6dd;
    border: 4px solid #7a4a1a;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    z-index: 160;
}

.modal .panelBody
{
    font-size: 14px;
    color: #4a2f08;
    line-height: 1.65;
}

.modal .btnRow
{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 10px;
    border-top: 3px solid #e2c88a;
}

.modal .btnRow .btn
{
    min-width: 88px;
    padding: 8px 10px;
}

.repTable
{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.repTable td
{
    padding: 4px 6px;
    border-bottom: 2px dashed #e2c88a;
}

.repTable td:last-child
{
    text-align: right;
    font-weight: 800;
}

.good
{
    color: #1a7a2a;
}

.bad
{
    color: #c03020;
}

/* ---------- toast ---------- */
#toastWrap
{
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    z-index: 170;
    pointer-events: none;
}

.toast
{
    background: rgba(30, 20, 5, 0.85);
    color: #ffe9b0;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 20px;
    border: 2px solid #ffca5f;
    white-space: nowrap;
    animation: toastIn 0.25s ease-out;
}

@keyframes toastIn
{
    from
    {
        opacity: 0;
        transform: translateY(-12px);
    }
    to
    {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- place mode hint bar ---------- */
#placeBar
{
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 8px;
    max-width: 94%;
    background: rgba(20, 50, 70, 0.88);
    border: 3px solid #ffca5f;
    border-radius: 14px;
    padding: 7px 10px;
    color: #fff;
    font-size: 13px;
    z-index: 35;
}

#placeBar #placeName
{
    flex: 1 1 auto;
    min-width: 0;
}

#placeBar .btn
{
    flex: 0 0 auto;
    padding: 6px 10px;
    font-size: 13px;
}

/* ---------- title screen ---------- */
#title
{
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 25%, #4fa3c7 0, #1d5f80 70%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 100;
}

#title h1
{
    color: #fff;
    font-size: clamp(30px, 7vw, 52px);
    text-shadow: 3px 3px 0 #14425a, -2px -2px 0 #14425a, 2px -2px 0 #14425a, -2px 2px 0 #14425a;
    letter-spacing: 2px;
}

#title .subtitle
{
    color: #cfeefb;
    font-size: 14px;
    margin-bottom: 12px;
}

#title .btn
{
    min-width: 220px;
    font-size: 17px;
    padding: 12px 20px;
}

#titleFish
{
    image-rendering: pixelated;
}

.small
{
    font-size: 11px;
    color: #8a6a30;
    font-weight: 600;
}

/* ---------- quest chip ---------- */
#questChip
{
    position: absolute;
    top: 8px;
    left: 8px;
    display: none;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 800;
    font-family: inherit;
    color: #fff;
    background: rgba(20, 50, 70, 0.88);
    border: 2px solid #ffca5f;
    border-radius: 14px;
    cursor: pointer;
    z-index: 25;
    max-width: 60%;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ---------- grand opening button ---------- */
#openBtn
{
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: none;
    padding: 12px 26px;
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    color: #5a3200;
    background: linear-gradient(#ffe083, #ffb43a);
    border: 4px solid #8a5a10;
    border-radius: 16px;
    box-shadow: 0 4px 0 #8a5a10, 0 6px 18px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    z-index: 32;
    animation: openPulse 1.2s ease-in-out infinite;
}

#openBtn:active
{
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 1px 0 #8a5a10;
}

@keyframes openPulse
{
    0%, 100%
    {
        transform: translateX(-50%) scale(1);
    }
    50%
    {
        transform: translateX(-50%) scale(1.06);
    }
}

/* ---------- launcher ---------- */
#launcher
{
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 20%, #4fa3c7 0, #1d5f80 70%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 110;
    padding: 16px;
}

#launcher h1
{
    color: #fff;
    font-size: clamp(30px, 7vw, 50px);
    text-shadow: 3px 3px 0 #14425a, -2px -2px 0 #14425a, 2px -2px 0 #14425a, -2px 2px 0 #14425a;
    letter-spacing: 3px;
}

#gameCards
{
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(420px, 94%);
    margin-top: 8px;
}

.gCard
{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: linear-gradient(#fff6dd, #f5e6bd);
    border: 4px solid #7a4a1a;
    border-radius: 16px;
    box-shadow: 0 4px 0 #7a4a1a;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
}

.gCard:active
{
    transform: translateY(3px);
    box-shadow: 0 1px 0 #7a4a1a;
}

.gCardIcon
{
    flex: 0 0 auto;
    image-rendering: pixelated;
    border: 3px solid #7a4a1a;
    border-radius: 10px;
}

.gCardInfo
{
    flex: 1 1 auto;
    min-width: 0;
}

.gCardName
{
    font-size: 17px;
    font-weight: 800;
    color: #4a2f08;
}

.gCardSub
{
    font-size: 12px;
    font-weight: 600;
    color: #8a6a30;
    margin-top: 2px;
}

.launcherFoot
{
    color: #cfeefb;
    font-size: 12px;
    margin-top: 6px;
}

/* ---------- save code ---------- */
.codeArea
{
    display: block;
    width: 100%;
    height: 110px;
    margin-top: 8px;
    padding: 8px;
    font-family: monospace;
    font-size: 11px;
    background: #fffdf4;
    border: 3px solid #c9a25a;
    border-radius: 10px;
    resize: none;
    word-break: break-all;
}

.selectable,
.selectable *
{
    -webkit-user-select: text;
    user-select: text;
    touch-action: auto;
}

input[type="range"]
{
    width: 100%;
    touch-action: pan-x;
}

</style>
</head>
<body>
<div id="game">
    <div id="hud">
        <span class="hudItem"><span class="ico">💰</span><span id="hudMoney">0G</span></span>
        <span class="hudItem"><span class="ico" id="hudRpIco">🔬</span><span id="hudRp">0P</span></span>
        <span class="hudItem"><span class="ico">💗</span><span id="hudFame">0</span></span>
        <span class="hudItem"><span class="ico">👥</span><span id="hudVis">0명</span></span>
        <span class="hudItem" id="hudLv">★</span>
        <span class="hudItem" id="hudDate">1년차 4월 1일</span>
        <button class="hudItem" id="btnSpeed" style="cursor:pointer;">▶×1</button>
    </div>
    <div id="canvasWrap">
        <canvas id="cv"></canvas>
        <div id="placeBar">
            <span id="placeName"></span>
            <button class="btn blue" id="btnPlaceRotate">↻ 회전</button>
            <button class="btn red" id="btnPlaceCancel">취소</button>
        </div>
        <button id="openBtn">🎉 개장하기!</button>
        <button id="questChip" style="display:none;"></button>
        <div id="panelHost"></div>
    </div>
    <div id="toolbar">
        <button class="tbBtn" id="tbBuild">🔨 건설</button>
        <button class="tbBtn" id="tbResearch">🔬 연구</button>
        <button class="tbBtn" id="tbSpecial" style="display:none;">📜 기획전</button>
        <button class="tbBtn" id="tbRequest">📋 의뢰</button>
        <button class="tbBtn" id="tbInfo">📊 정보</button>
        <button class="tbBtn" id="tbMenu">⚙️ 메뉴</button>
    </div>
    <div id="dim"></div>
    <div id="modalHost"></div>
    <div id="toastWrap"></div>
    <div id="title">
        <canvas id="titleFish" width="160" height="90"></canvas>
        <h1 id="titleName"></h1>
        <div class="subtitle" id="titleSub"></div>
        <button class="btn blue" id="btnContinue">▶ 이어서 하기</button>
        <button class="btn" id="btnNew">✨ 처음부터 하기</button>
        <button class="btn gray" id="btnBackLauncher">◀ 게임 선택으로</button>
    </div>
    <div id="launcher">
        <h1 id="launcherTitle">스토리 박스</h1>
        <div class="subtitle" id="launcherSub">🎁 하고 싶은 게임을 골라줘!</div>
        <div id="gameCards"></div>
        <div class="launcherFoot" id="launcherFoot">세상에 하나뿐인 게임 3종 세트</div>
    </div>
</div>

<script>
// Story Box - shared constants and per-theme game data
// All comments ASCII only. UI strings are Korean by design.

// the player this game was made for
var OWNER_NAME = '은혜';

// shown in the launcher/menu so a stale cached client is easy to spot
var GAME_VER = '2.5';

var TS = 32;            // tile size in world px
var WALL_H = 26;        // decorative wall band height above the map (world px)
var MAP_W = 20;         // full map width in tiles
var MAP_H = 13;         // full map height in tiles
var EXP_W = [12, 16, 20];   // usable width per expansion stage
var ENTRANCE = { x: 5, y: 12 };
var DAY_MS = 1250;      // real ms per game day at speed x1
var DAYS_PER_MONTH = 24;
var MAX_VISITORS = 34;        // normal concurrent ceiling
var BURST_BONUS = 10;         // extra slots opened up during a group visit
var MAX_VISITORS_BURST = 44;  // ceiling while a group visit is under way
var COMBO_RANGE = 4;    // chebyshev distance between combo member objects

// theme-selected globals, assigned by loadTheme()
var THEME = null;
var BUILD = null;
var BUILD_ORDER_TANK = null;
var BUILD_ORDER_FAC = null;
var SPECIES = null;
var SPECIES_ORDER = null;
var COMBOS = null;
var LEVELS = null;
var EVENTS = null;
var FLOORS = null;
var REVIEWS_GOOD = null;
var REVIEWS_MID = null;
var REVIEWS_BAD = null;

// ---------- shared structural stats ----------
// enclosures (tank slots) and facilities share stats across themes; labels differ
var ENC_STATS = {
    small:  { w: 1, h: 1, cost: 500,   maint: 25,  cls: 1, base: 2,  lvReq: 1 },
    touch:  { w: 2, h: 1, cost: 1400,  maint: 50,  cls: 1, base: 4,  lvReq: 1, touch: true },
    mid:    { w: 2, h: 1, cost: 1600,  maint: 60,  cls: 2, base: 5,  lvReq: 1 },
    large:  { w: 2, h: 2, cost: 4200,  maint: 140, cls: 3, base: 9,  lvReq: 2 },
    tunnel: { w: 3, h: 1, cost: 7500,  maint: 220, cls: 3, base: 14, lvReq: 3 },
    dome:   { w: 3, h: 3, cost: 18000, maint: 550, cls: 4, base: 22, lvReq: 4 }
};

var FAC_STATS = {
    snack:  { w: 1, h: 1, cost: 700,  maint: 30, need: 'hunger', sell: 120, lvReq: 1 },
    vend:   { w: 1, h: 1, cost: 350,  maint: 10, need: 'thirst', sell: 45,  lvReq: 1 },
    bench:  { w: 1, h: 1, cost: 250,  maint: 5,  need: 'energy', sell: 0,   lvReq: 1 },
    toilet: { w: 1, h: 1, cost: 600,  maint: 20, need: 'toilet', sell: 0,   lvReq: 1 },
    flower: { w: 1, h: 1, cost: 180,  maint: 5,  aura: 2,        sell: 0,   lvReq: 1 },
    sign:   { w: 1, h: 1, cost: 220,  maint: 5,  aura: 1,        sell: 0,   lvReq: 1 },
    ice:    { w: 1, h: 1, cost: 550,  maint: 25, need: 'hunger', sell: 80,  lvReq: 1 },
    photo:  { w: 1, h: 1, cost: 900,  maint: 15, fun: true,      sell: 0,   lvReq: 2 },
    gift:   { w: 2, h: 1, cost: 1800, maint: 60, gift: true,     sell: 250, lvReq: 2 },
    cafe:   { w: 2, h: 1, cost: 2600, maint: 90, need: 'hunger', sell: 200, lvReq: 3, rest: true }
};

var BUILD_TANK_ORDER = ['small', 'touch', 'mid', 'large', 'tunnel', 'dome'];
var BUILD_FAC_ORDER = ['bench', 'vend', 'flower', 'sign', 'snack', 'ice', 'toilet', 'photo', 'gift', 'cafe'];

// labels: { type: [name, desc] }
function makeBuild(labels)
{
    var out = {};
    var k;
    for (k in ENC_STATS)
    {
        var e = ENC_STATS[k];
        out[k] = {
            kind: 'tank', name: labels[k][0], desc: labels[k][1],
            w: e.w, h: e.h, cost: e.cost, maint: e.maint, cls: e.cls, base: e.base, lvReq: e.lvReq, touch: !!e.touch
        };
    }
    for (k in FAC_STATS)
    {
        var f = FAC_STATS[k];
        out[k] = {
            kind: 'fac', name: labels[k][0], desc: labels[k][1],
            w: f.w, h: f.h, cost: f.cost, maint: f.maint, need: f.need, aura: f.aura,
            fun: f.fun, gift: f.gift, rest: f.rest, sell: f.sell, lvReq: f.lvReq
        };
    }
    return out;
}

// ---------- shared tables ----------
// visitor job types. the first three visit from day one; the rest start
// visiting as fame grows (unlockFame), announced once via a modal.
// perks: rpMul multiplies research from views, fameChance adds extra

function seasonOf(month)
{
    if (month >= 3 && month <= 5)
    {
        return 'spring';
    }
    if (month >= 6 && month <= 8)
    {
        return 'summer';
    }
    if (month >= 9 && month <= 11)
    {
        return 'autumn';
    }
    return 'winter';
}

// ---------- quest helpers ----------
function qCountTanks(S)
{
    var n = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        if (BUILD[S.objects[i].type].kind === 'tank')
        {
            n++;
        }
    }
    return n;
}

function qDistinctSpecies(S)
{
    var seen = {};
    var n = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        if (BUILD[o.type].kind === 'tank' && o.species && !seen[o.species])
        {
            seen[o.species] = true;
            n++;
        }
    }
    return n;
}

function qHasFacTypes(S, types)
{
    for (var t = 0; t < types.length; t++)
    {
        if (!hasType(S, types[t]))
        {
            return false;
        }
    }
    return true;
}

function qDisplayed(S, sp)
{
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        if (BUILD[o.type].kind === 'tank' && o.species === sp)
        {
            return true;
        }
    }
    return false;
}

function qGoodPairExists(S)
{
    var tanks = S.objects.filter(function (o) { return BUILD[o.type].kind === 'tank' && o.species; });
    for (var i = 0; i < tanks.length; i++)
    {
        for (var j = i + 1; j < tanks.length; j++)
        {
            var dist = Math.max(Math.abs(tanks[i].x - tanks[j].x), Math.abs(tanks[i].y - tanks[j].y));
            if (dist <= 2 && persRelation(SPECIES[tanks[i].species].pers, SPECIES[tanks[j].species].pers) > 0)
            {
                return true;
            }
        }
    }
    return false;
}

// ---------- events factory ----------
// es: per-theme strings { tv:[title,text], group:[..], storm:[..], viral:[..], donation:[..],
//                         sick:[title,text,yesLabel,noLabel,yesOkMsg,noMsg] }
function makeEvents(es)
{
    return [
        {
            id: 'tv', weight: 3,
            cond: function (S) { return S.fame >= 60; },
            title: es.tv[0], text: es.tv[1],
            apply: function (S) { var g = Math.floor(S.fame * 0.12) + 20; S.fame += g; return '인기 +' + g; }
        },
        {
            id: 'group', weight: 4,
            cond: function (S) { return S.fame >= 30; },
            title: es.group[0], text: es.group[1],
            apply: function (S) { S.groupBurst = 14; return '관람객이 잔뜩 몰려옵니다!'; }
        },
        {
            id: 'storm', weight: 2,
            cond: function (S) { return S.fame >= 50; },
            title: es.storm[0], text: es.storm[1],
            apply: function (S) { S.stormMonth = true; return '이번 달 관람객 감소'; }
        },
        {
            id: 'viral', weight: 3,
            cond: function (S) { return hasType(S, 'photo'); },
            title: es.viral[0], text: es.viral[1],
            apply: function (S) { S.fame += 15; return '인기 +15'; }
        },
        {
            id: 'donation', weight: 2,
            cond: function (S) { return S.fame >= 120; },
            title: es.donation[0], text: es.donation[1],
            apply: function (S) { S.money += 1500; return '자금 +1500G'; }
        },
        {
            id: 'sick', weight: 3, choice: true,
            cond: function (S) { return countStockedTanks(S) >= 2; },
            title: es.sick[0], text: es.sick[1],
            yes: es.sick[2], no: es.sick[3],
            applyYes: function (S)
            {
                if (S.rp >= 20)
                {
                    S.rp -= 20;
                    S.fame += 5;
                    return es.sick[4];
                }
                S.fame = Math.max(0, S.fame - 10);
                return 'P가 부족했습니다... 인기 -10';
            },
            applyNo: function (S) { S.fame = Math.max(0, S.fame - 12); return es.sick[5]; }
        }
    ];
}

function hasType(S, t)
{
    for (var i = 0; i < S.objects.length; i++)
    {
        if (S.objects[i].type === t)
        {
            return true;
        }
    }
    return false;
}

function countStockedTanks(S)
{
    var n = 0;
    for (var i = 0; i < S.objects.length; i++)
    {
        var o = S.objects[i];
        if (BUILD[o.type].kind === 'tank' && o.species)
        {
            n++;
        }
    }
    return n;
}

// relation between two cat personalities: 1 good, -1 bad, 0 neutral
function persRelation(a, b)
{
    if (!a || !b)
    {
        return 0;
    }
    if (a === '애교' || b === '애교')
    {
        return 1;
    }
    if (a === b)
    {
        return 1;
    }
    if ((a === '도도' && b === '활발') || (a === '활발' && b === '도도'))
    {
        return -1;
    }
    if ((a === '얌전' && b === '활발') || (a === '활발' && b === '얌전'))
    {
        return -1;
    }
    return 0;
}

    for (var k in stats)
    {
        def[k] = stats[k];
    }
    theme.build[id] = def;
}

// Aquarium Story - pixel art sprites and drawing helpers
// All comments ASCII only.

// generic pixel-map renderer. rows: array of strings, pal: char->color map.
// px: size of one sprite pixel. flip: mirror horizontally.
function drawPix(ctx, rows, pal, x, y, px, flip)
{
    for (var r = 0; r < rows.length; r++)
    {
        var row = rows[r];
        for (var c = 0; c < row.length; c++)
        {
            var ch = row.charAt(c);
            if (ch === '.')
            {
                continue;
            }
            var col = pal[ch];
            if (!col)
            {
                continue;
            }
            var cx = flip ? (row.length - 1 - c) : c;
            ctx.fillStyle = col;
            ctx.fillRect(Math.round(x + cx * px), Math.round(y + r * px), Math.ceil(px), Math.ceil(px));
        }
    }
}

function drawVisitor(ctx, v, x, y)
{
    // soft ground shadow so characters sit on the floor
    ctx.fillStyle = 'rgba(30,25,20,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y + 3, 7, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    var t = v.vt;
    var pal = {
        h: t.hair,
        s: t.skin,
        e: '#202028',
        b: t.body,
        p: t.pants,
        k: '#302820'
    };
    var frames;
    var flip = false;
    if (v.dir === 'up')
    {
        frames = [VIS_UP_A, VIS_UP_B];
    }
    else
    {
        if (v.dir === 'side')
        {
            frames = [VIS_SIDE_A, VIS_SIDE_B];
            flip = !!v.flipX;
        }
        else
        {
            frames = [VIS_DOWN_A, VIS_DOWN_B];
        }
    }
    var rows = v.moving ? frames[v.animFrame] : frames[0];
    var px = 2;
    // 8x11 sprite at px2 = 16x22, centered on tile
    drawPix(ctx, rows, pal, x - 8, y - 20, px, flip);
}

        '.111111..',
        '.1e11e1..',
        '.121121..',
        '..1111...',
        '.111111..',
        '.1111111.',
        '.122221.1',
        '..1..1...'
    ]
};

function drawCreature(ctx, sp, x, y, px, flip, frame)
{
    var shape = sp.shape;
    var rows = SHAPES[shape];
    if (shape === 'jelly' && frame === 1)
    {
        rows = SHAPES.jellyB;
    }
    if (shape === 'cat' && frame === 1)
    {
        rows = SHAPES.catB;
    }
    var pal = {
        1: sp.c1,
        2: sp.c2,
        e: '#182028',
        o: '#ff9020',
        w: '#ffffff',
        d: '#182028'
    };
    drawPix(ctx, rows, pal, x, y, px, flip);
}

// ---------- tank drawing ----------
// pulsing plus marker for empty exhibit slots (replaces blurry small text)
function drawEmptyMark(ctx, wx, wy, W, H, t)
{
    var cxm = wx + Math.floor(W / 2);
    var cym = wy + Math.floor(H / 2);
    var a = 0.65 + Math.sin(t * 3) * 0.2;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, cxm - 8, cym - 8, 16, 16, 5);
    ctx.fill();
    ctx.fillStyle = '#e08830';
    ctx.fillRect(cxm - 5, cym - 1, 10, 3);
    ctx.fillRect(cxm - 1, cym - 5, 3, 10);
    ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r)
{
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// o: object, wx/wy: world pixel origin of the object, t: time seconds
// dispatches by theme enclosure style
function drawTank(ctx, o, wx, wy, t)
{
    if (THEME && THEME.enclosure === 'case')
    {
        drawCaseEnclosure(ctx, o, wx, wy, t);
        return;
    }
    if (THEME && THEME.enclosure === 'cat')
    {
        drawCatEnclosure(ctx, o, wx, wy, t);
        return;
    }
    drawWaterTank(ctx, o, wx, wy, t);
}

function drawWaterTank(ctx, o, wx, wy, t)
{
    var b = BUILD[o.type];
    var W = b.w * TS;
    var H = b.h * TS;
    var m = 2;
    var isTouch = !!b.touch;
    var sp = o.species ? SPECIES[o.species] : null;
    var cold = sp && (sp.shape === 'penguin' || sp.shape === 'beluga');

    // outer rim
    ctx.fillStyle = isTouch ? '#e8b060' : '#38566a';
    roundRect(ctx, wx + m, wy + m, W - m * 2, H - m * 2, 5);
    ctx.fill();

    // water
    var wm = m + 3;
    var g = ctx.createLinearGradient(0, wy + wm, 0, wy + H - wm);
    if (cold)
    {
        g.addColorStop(0, '#bfeaf5');
        g.addColorStop(1, '#6fc0dd');
    }
    else
    {
        g.addColorStop(0, '#7fd4ef');
        g.addColorStop(1, '#2f8fc0');
    }
    ctx.fillStyle = g;
    ctx.fillRect(wx + wm, wy + wm, W - wm * 2, H - wm * 2);

    // sand or ice bottom
    ctx.fillStyle = cold ? '#eef8fc' : '#e8d8a0';
    ctx.fillRect(wx + wm, wy + H - wm - 4, W - wm * 2, 4);

    // wave lines
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    var wcount = Math.max(1, b.w);
    for (var i = 0; i < wcount; i++)
    {
        var phase = (t * 20 + i * 17) % (W - wm * 2 - 8);
        ctx.fillRect(wx + wm + 2 + phase, wy + wm + 2, 6, 2);
    }

    // creatures
    if (sp)
    {
        var n = Math.min(2 + (o.lv || 1), 5);
        var rowsArr = SHAPES[sp.shape];
        var shW = rowsArr[0].length;
        var shH = rowsArr.length;
        var big = (sp.cls >= 3);
        var px = big ? Math.max(1, Math.floor((W - wm * 2 - 6) / shW)) : 1;
        if (px > 2)
        {
            px = 2;
        }
        if (big && n > 2)
        {
            n = 2;
        }
        var innerW = W - wm * 2;
        var innerH = H - wm * 2;
        for (var k = 0; k < n; k++)
        {
            var span = Math.max(4, innerW - shW * px - 4);
            var ph = (t * (14 + k * 5) + k * 53);
            var cycle = Math.floor(ph / span);
            var off = ph % span;
            var flip = (cycle % 2 === 1);
            var fx = wx + wm + 2 + (flip ? span - off : off);
            var fy = wy + wm + 2 + ((k * 13 + 3) % Math.max(1, innerH - shH * px - 4));
            fy += Math.sin(t * 2 + k) * 1.5;
            var frame = (Math.floor(t * 2) + k) % 2;
            drawCreature(ctx, sp, fx, fy, px, !flip, frame);
        }
    }
    else
    {
        drawEmptyMark(ctx, wx, wy, W, H, t);
    }

    // bubbles
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (var bb = 0; bb < b.w; bb++)
    {
        var by = (wy + H - wm - 4) - ((t * 12 + bb * 20) % (H - wm * 2 - 6));
        ctx.fillRect(wx + wm + 5 + bb * 22, by, 2, 2);
    }

    // glass shine
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(wx + wm + 2, wy + wm + 2, 3, H - wm * 2 - 8);

    // level stars
    if (o.lv && o.lv > 1)
    {
        ctx.fillStyle = '#ffd020';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('Lv' + o.lv, wx + m + 2, wy + m + 9);
    }
}

// museum: display case on a wooden pedestal
function drawCaseEnclosure(ctx, o, wx, wy, t)
{
    var b = BUILD[o.type];
    var W = b.w * TS;
    var H = b.h * TS;
    var m = 2;
    var sp = o.species ? SPECIES[o.species] : null;
    var isTouch = !!b.touch;

    // pedestal rim
    ctx.fillStyle = isTouch ? '#c8925a' : '#6a4a28';
    roundRect(ctx, wx + m, wy + m, W - m * 2, H - m * 2, 5);
    ctx.fill();

    // inner display wall
    var wm = m + 3;
    var g = ctx.createLinearGradient(0, wy + wm, 0, wy + H - wm);
    g.addColorStop(0, '#faf3e2');
    g.addColorStop(1, '#e8dcc0');
    ctx.fillStyle = g;
    ctx.fillRect(wx + wm, wy + wm, W - wm * 2, H - wm * 2);

    // display base strip
    ctx.fillStyle = '#b89868';
    ctx.fillRect(wx + wm, wy + H - wm - 4, W - wm * 2, 4);

    if (sp)
    {
        var rows = SHAPES[sp.shape];
        var shW = rows[0].length;
        var shH = rows.length;
        var innerW = W - wm * 2;
        var innerH = H - wm * 2;
        var px = Math.max(1, Math.min(Math.floor((innerW - 6) / shW), Math.floor((innerH - 8) / shH)));
        if (px > 3)
        {
            px = 3;
        }
        var ax = wx + wm + Math.floor((innerW - shW * px) / 2);
        var ay = wy + wm + Math.floor((innerH - 4 - shH * px) / 2) + 1;
        drawCreature(ctx, sp, ax, ay, px, false, 0);
        // sparkle blink
        var ph = (t * 0.8 + o.id * 0.7) % 3;
        if (ph < 0.3)
        {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ax + shW * px - 2, ay + 1, 2, 2);
            ctx.fillRect(ax + shW * px - 1, ay, 1, 4);
            ctx.fillRect(ax + shW * px - 3, ay + 2, 4, 1);
        }
    }
    else
    {
        drawEmptyMark(ctx, wx, wy, W, H, t);
    }

    // glass shine
    if (!isTouch)
    {
        ctx.fillStyle = 'rgba(180,220,255,0.28)';
        ctx.fillRect(wx + wm + 2, wy + wm + 2, 3, H - wm * 2 - 8);
    }

    // level tag
    if (o.lv && o.lv > 1)
    {
        ctx.fillStyle = '#ffd020';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('Lv' + o.lv, wx + m + 2, wy + m + 9);
    }
}

// cat cafe: wooden cat zone with roaming cats
function drawCatEnclosure(ctx, o, wx, wy, t)
{
    var b = BUILD[o.type];
    var W = b.w * TS;
    var H = b.h * TS;
    var m = 2;
    var sp = o.species ? SPECIES[o.species] : null;

    // zone rim
    ctx.fillStyle = !!b.touch ? '#e8b060' : '#a87840';
    roundRect(ctx, wx + m, wy + m, W - m * 2, H - m * 2, 6);
    ctx.fill();

    // wooden floor
    var wm = m + 3;
    ctx.fillStyle = '#eccf9c';
    ctx.fillRect(wx + wm, wy + wm, W - wm * 2, H - wm * 2);
    ctx.fillStyle = 'rgba(150,110,60,0.35)';
    for (var ln = 1; ln < b.h * 3; ln++)
    {
        ctx.fillRect(wx + wm, wy + wm + ln * 10, W - wm * 2, 1);
    }

    // rug
    ctx.fillStyle = '#e08888';
    roundRect(ctx, wx + wm + 3, wy + H - wm - 9, Math.max(10, W - wm * 2 - 12), 6, 3);
    ctx.fill();

    // cat tower for bigger zones
    if (b.cls >= 2)
    {
        var tx = wx + W - wm - 8;
        ctx.fillStyle = '#8a6038';
        ctx.fillRect(tx + 2, wy + wm + 4, 3, H - wm * 2 - 8);
        ctx.fillStyle = '#c89858';
        ctx.fillRect(tx - 2, wy + wm + 6, 10, 3);
        ctx.fillRect(tx - 2, wy + Math.floor(H / 2), 10, 3);
    }

    if (sp)
    {
        var rows = SHAPES.cat;
        var shW = rows[0].length;
        var shH = rows.length;
        var innerW = W - wm * 2;
        var innerH = H - wm * 2;
        var px = (innerW >= 44 && innerH >= 26) ? 2 : 1;
        var n = Math.min(b.cls, 1 + (o.lv || 1));
        if (n > 3)
        {
            n = 3;
        }
        for (var k = 0; k < n; k++)
        {
            var span = Math.max(4, innerW - shW * px - 6);
            var ph = (t * (6 + k * 3) + k * 37);
            var cycle = Math.floor(ph / span);
            var off = ph % span;
            var flip = (cycle % 2 === 1);
            var fx = wx + wm + 3 + (flip ? span - off : off);
            var fy = wy + wm + Math.max(2, innerH - shH * px - 5 - (k % 2) * 3);
            var frame = (Math.floor(t * 1.5) + k) % 2;
            drawCreature(ctx, sp, fx, fy, px, flip, frame);
        }
    }
    else
    {
        drawEmptyMark(ctx, wx, wy, W, H, t);
    }

    if (o.lv && o.lv > 1)
    {
        ctx.fillStyle = '#ffd020';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('Lv' + o.lv, wx + m + 2, wy + m + 9);
    }

    // low mood indicator
    if (sp && o.mood !== undefined && o.mood < 45)
    {
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        var bob = Math.sin(t * 3) * 2;
        ctx.fillText('💤', wx + W - 8, wy + 4 + bob);
        ctx.textAlign = 'left';
    }
}

// ---------- floor tiles ----------
var FLOOR_COLORS = {
    fpath:   { base: '#cfd8dc', line: '#a9b6bd', dot: '#eef3f5' },
    fgarden: { base: '#bfe3b8', line: '#96c98d', dot: '#ff7ba8' },
    fgold:   { base: '#f2dd9a', line: '#d8bc63', dot: '#fff3c4' },
    fstudy:  { base: '#cfc4ec', line: '#a897d6', dot: '#efe8ff' }
};

function drawFloorTile(ctx, id, wx, wy)
{
    var c = FLOOR_COLORS[id];
    if (!c)
    {
        return;
    }
    ctx.fillStyle = c.base;
    ctx.fillRect(wx, wy, TS, TS);
    ctx.fillStyle = c.line;
    if (id === 'fpath')
    {
        // stone slabs
        ctx.fillRect(wx, wy + TS / 2 - 1, TS, 2);
        ctx.fillRect(wx + TS / 2 - 1, wy, 2, TS / 2);
        ctx.fillRect(wx + 6, wy + TS / 2 + 1, 2, TS / 2 - 1);
    }
    if (id === 'fgarden')
    {
        ctx.fillRect(wx, wy + 6, TS, 1);
        ctx.fillRect(wx, wy + 20, TS, 1);
        ctx.fillStyle = c.dot;
        ctx.fillRect(wx + 7, wy + 10, 3, 3);
        ctx.fillRect(wx + 20, wy + 22, 3, 3);
        ctx.fillRect(wx + 24, wy + 5, 3, 3);
    }
    if (id === 'fgold')
    {
        for (var g = 0; g < 4; g++)
        {
            ctx.fillRect(wx + (g % 2) * 16, wy + Math.floor(g / 2) * 16, 16, 1);
            ctx.fillRect(wx + (g % 2) * 16, wy + Math.floor(g / 2) * 16, 1, 16);
        }
        ctx.fillStyle = c.dot;
        ctx.fillRect(wx + 12, wy + 12, 4, 4);
        ctx.fillRect(wx + 4, wy + 24, 2, 2);
        ctx.fillRect(wx + 25, wy + 6, 2, 2);
    }
    if (id === 'fstudy')
    {
        ctx.fillRect(wx + 4, wy + 4, TS - 8, 1);
        ctx.fillRect(wx + 4, wy + TS - 5, TS - 8, 1);
        ctx.fillStyle = c.dot;
        ctx.fillRect(wx + 9, wy + 12, 14, 2);
        ctx.fillRect(wx + 9, wy + 17, 9, 2);
    }
}

// ---------- facility drawing ----------
var FAC_COLORS = {
    snack:  { roof: '#ff6040', wall: '#fff0d0' },
    vend:   { roof: '#d02020', wall: '#e04040' },
    toilet: { roof: '#4080d0', wall: '#d0e8f8' },
    ice:    { roof: '#70c8f0', wall: '#fff8f0' },
    cafe:   { roof: '#907050', wall: '#f8e8d0' },
    gift:   { roof: '#e070a0', wall: '#fff0f4' },
    photo:  { roof: '#8060c0', wall: '#f0e8ff' }
};

function drawFacility(ctx, o, wx, wy, t)
{
    var b = BUILD[o.type];
    var W = b.w * TS;
    var H = b.h * TS;

    if (o.type === 'bench')
    {
        ctx.fillStyle = '#8a5a28';
        ctx.fillRect(wx + 4, wy + 12, W - 8, 6);
        ctx.fillStyle = '#a87038';
        ctx.fillRect(wx + 4, wy + 8, W - 8, 4);
        ctx.fillStyle = '#5a3a18';
        ctx.fillRect(wx + 6, wy + 18, 3, 8);
        ctx.fillRect(wx + W - 9, wy + 18, 3, 8);
        return;
    }
    if (o.type === 'flower')
    {
        ctx.fillStyle = '#7a5a30';
        roundRect(ctx, wx + 3, wy + 8, W - 6, H - 12, 4);
        ctx.fill();
        ctx.fillStyle = '#48a838';
        roundRect(ctx, wx + 5, wy + 10, W - 10, H - 16, 3);
        ctx.fill();
        var cols = ['#ff5070', '#ffd040', '#ff90c0', '#ffffff'];
        for (var i = 0; i < 6; i++)
        {
            ctx.fillStyle = cols[i % cols.length];
            var fx = wx + 7 + (i * 7) % (W - 14);
            var fy = wy + 12 + ((i * 5) % (H - 20));
            ctx.fillRect(fx, fy, 3, 3);
        }
        return;
    }
    if (o.type === 'sign')
    {
        ctx.fillStyle = '#8a5a28';
        ctx.fillRect(wx + TS / 2 - 2, wy + 12, 4, 14);
        ctx.fillStyle = '#f8f0d8';
        ctx.fillRect(wx + 5, wy + 4, TS - 10, 12);
        ctx.strokeStyle = '#7a4a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx + 5, wy + 4, TS - 10, 12);
        ctx.fillStyle = '#4080d0';
        ctx.fillRect(wx + 8, wy + 7, TS - 16, 2);
        ctx.fillRect(wx + 8, wy + 11, TS - 20, 2);
        return;
    }
    if (o.type === 'photo')
    {
        // arch frame with camera
        ctx.fillStyle = '#8060c0';
        ctx.fillRect(wx + 4, wy + 4, 4, H - 8);
        ctx.fillRect(wx + W - 8, wy + 4, 4, H - 8);
        ctx.fillRect(wx + 4, wy + 4, W - 8, 4);
        ctx.fillStyle = '#ffd040';
        ctx.fillRect(wx + 6, wy + 6, 3, 3);
        ctx.fillRect(wx + W - 9, wy + 6, 3, 3);
        ctx.fillStyle = '#303038';
        ctx.fillRect(wx + W / 2 - 4, wy + 14, 8, 6);
        ctx.fillStyle = '#80c0f0';
        ctx.fillRect(wx + W / 2 - 1, wy + 16, 3, 3);
        // blinking flash
        if (Math.floor(t * 2) % 4 === 0)
        {
            ctx.fillStyle = 'rgba(255,255,220,0.9)';
            ctx.fillRect(wx + W / 2 - 6, wy + 12, 3, 3);
        }
        return;
    }
    if (o.type === 'vend')
    {
        ctx.fillStyle = '#c02828';
        roundRect(ctx, wx + 6, wy + 3, W - 12, H - 8, 3);
        ctx.fill();
        ctx.fillStyle = '#f0f0f8';
        ctx.fillRect(wx + 9, wy + 6, W - 18, 8);
        ctx.fillStyle = '#282830';
        ctx.fillRect(wx + 9, wy + 17, W - 18, 5);
        ctx.fillStyle = '#ffd040';
        ctx.fillRect(wx + 10, wy + 7, 3, 3);
        ctx.fillStyle = '#40c0f0';
        ctx.fillRect(wx + 15, wy + 7, 3, 3);
        return;
    }

    if (o.type === 'foodcart')
    {
        // little cart with wheels and a parasol
        ctx.fillStyle = '#c8503a';
        ctx.fillRect(wx + 5, wy + 12, W - 10, 10);
        ctx.fillStyle = '#f0e0c0';
        ctx.fillRect(wx + 7, wy + 14, W - 14, 4);
        ctx.fillStyle = '#3a3230';
        ctx.beginPath();
        ctx.arc(wx + 10, wy + 25, 3, 0, Math.PI * 2);
        ctx.arc(wx + W - 10, wy + 25, 3, 0, Math.PI * 2);
        ctx.fill();
        // parasol
        ctx.fillStyle = '#8a5a28';
        ctx.fillRect(wx + W / 2 - 1, wy + 2, 2, 12);
        for (var pu = 0; pu < 3; pu++)
        {
            ctx.fillStyle = (pu % 2 === 0) ? '#ffd040' : '#ff7040';
            ctx.fillRect(wx + 6 + pu * ((W - 12) / 3), wy + 4, (W - 12) / 3, 4);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(wx + 8, wy + 8, W - 16, 1);
        return;
    }
    if (o.type === 'garden')
    {
        // flowerbed strip with a tiny bench in the middle
        ctx.fillStyle = '#48a838';
        roundRect(ctx, wx + 3, wy + 6, W - 6, H - 10, 5);
        ctx.fill();
        ctx.fillStyle = '#3a8a2c';
        roundRect(ctx, wx + 3, wy + H - 9, W - 6, 5, 3);
        ctx.fill();
        var gcols = ['#ff5070', '#ffd040', '#ff90c0', '#ffffff', '#b080f0'];
        for (var gf = 0; gf < 10; gf++)
        {
            ctx.fillStyle = gcols[gf % gcols.length];
            ctx.fillRect(wx + 6 + (gf * 11) % (W - 12), wy + 8 + ((gf * 7) % (H - 18)), 3, 3);
        }
        // bench
        ctx.fillStyle = '#a87038';
        ctx.fillRect(wx + W / 2 - 8, wy + H / 2 - 3, 16, 4);
        ctx.fillStyle = '#5a3a18';
        ctx.fillRect(wx + W / 2 - 7, wy + H / 2 + 1, 3, 5);
        ctx.fillRect(wx + W / 2 + 4, wy + H / 2 + 1, 3, 5);
        return;
    }
    if (o.type === 'fountain')
    {
        // stone basin with a theme statue on a pedestal
        ctx.fillStyle = '#98a0a8';
        roundRect(ctx, wx + 3, wy + 3, W - 6, H - 6, 10);
        ctx.fill();
        ctx.fillStyle = '#6fc0dd';
        roundRect(ctx, wx + 8, wy + 8, W - 16, H - 16, 8);
        ctx.fill();
        // ripple rings
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        var rr = 4 + ((t * 10) % 10);
        ctx.beginPath();
        ctx.arc(wx + W / 2, wy + H / 2, rr, 0, Math.PI * 2);
        ctx.stroke();
        // pedestal + statue silhouette
        ctx.fillStyle = '#c8ccd0';
        ctx.fillRect(wx + W / 2 - 7, wy + H / 2 + 2, 14, 6);
        var statueSp = null;
        if (THEME && THEME.id === 'aqua')
        {
            statueSp = { shape: 'dolphin', c1: '#b8c4cc', c2: '#d8e0e4' };
        }
        else
        {
            if (THEME && THEME.id === 'museum')
            {
                statueSp = { shape: 'trex', c1: '#b8bcc0', c2: '#d0d4d8' };
            }
            else
            {
                statueSp = { shape: 'cat', c1: '#b8bcc0', c2: '#d0d4d8' };
            }
        }
        var srows = SHAPES[statueSp.shape];
        var spx = Math.max(1, Math.min(Math.floor((W - 24) / srows[0].length), Math.floor((H - 26) / srows.length)));
        drawCreature(ctx, statueSp, wx + W / 2 - srows[0].length * spx / 2, wy + H / 2 - srows.length * spx + 2, spx, false, 0);
        // spray dots
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for (var sd = 0; sd < 4; sd++)
        {
            var sy2 = (t * 26 + sd * 9) % 14;
            ctx.fillRect(wx + W / 2 - 6 + sd * 4, wy + H / 2 - 8 - sy2 + 8, 2, 2);
        }
        return;
    }
    if (o.type === 'game')
    {
        // arcade cabinet with a glowing screen
        ctx.fillStyle = '#3a3048';
        roundRect(ctx, wx + 5, wy + 3, W - 10, H - 7, 4);
        ctx.fill();
        var glow = 0.5 + Math.abs(Math.sin(t * 3)) * 0.5;
        ctx.fillStyle = 'rgba(90,220,255,' + glow.toFixed(2) + ')';
        ctx.fillRect(wx + 8, wy + 6, W - 16, 9);
        ctx.fillStyle = '#181420';
        ctx.fillRect(wx + 8, wy + 17, W - 16, 4);
        ctx.fillStyle = '#ff5070';
        ctx.fillRect(wx + 10, wy + 23, 4, 4);
        ctx.fillStyle = '#ffd040';
        ctx.fillRect(wx + 17, wy + 23, 4, 4);
        return;
    }
    if (o.type === 'special1')
    {
        // 2x2 request-reward attraction, themed per game
        if (THEME && THEME.id === 'aqua')
        {
            // pirate ship on a small pond
            ctx.fillStyle = '#5aaccc';
            roundRect(ctx, wx + 3, wy + H - 22, W - 6, 18, 8);
            ctx.fill();
            ctx.fillStyle = '#7a4a22';
            ctx.beginPath();
            ctx.moveTo(wx + 10, wy + H - 24);
            ctx.lineTo(wx + W - 10, wy + H - 24);
            ctx.lineTo(wx + W - 18, wy + H - 12);
            ctx.lineTo(wx + 18, wy + H - 12);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#5a3416';
            ctx.fillRect(wx + W / 2 - 2, wy + 8, 4, H - 30);
            ctx.fillStyle = '#f0f0e0';
            ctx.beginPath();
            ctx.moveTo(wx + W / 2 + 2, wy + 10);
            ctx.lineTo(wx + W / 2 + 20, wy + 18);
            ctx.lineTo(wx + W / 2 + 2, wy + 26);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#282830';
            ctx.fillRect(wx + W / 2 - 8, wy + 4, 12, 7);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(wx + W / 2 - 5, wy + 6, 2, 2);
            ctx.fillRect(wx + W / 2 - 1, wy + 6, 2, 2);
        }
        else
        {
            if (THEME && THEME.id === 'museum')
            {
                // silver time capsule on a pedestal
                ctx.fillStyle = '#b8a888';
                roundRect(ctx, wx + 6, wy + H - 16, W - 12, 12, 4);
                ctx.fill();
                ctx.fillStyle = '#c8d0d8';
                roundRect(ctx, wx + W / 2 - 14, wy + 10, 28, H - 28, 14);
                ctx.fill();
                ctx.fillStyle = '#8898a8';
                ctx.fillRect(wx + W / 2 - 14, wy + H / 2 - 3, 28, 4);
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(wx + W / 2 - 9, wy + 14, 4, H - 36);
                ctx.fillStyle = '#e8c040';
                ctx.fillRect(wx + W / 2 - 3, wy + 4, 6, 6);
            }
            else
            {
                // pink cat castle with two towers
                ctx.fillStyle = '#e8a0b8';
                ctx.fillRect(wx + 8, wy + 16, W - 16, H - 22);
                ctx.fillStyle = '#d8809c';
                ctx.fillRect(wx + 6, wy + 8, 14, H - 14);
                ctx.fillRect(wx + W - 20, wy + 8, 14, H - 14);
                ctx.fillStyle = '#b85878';
                ctx.beginPath();
                ctx.moveTo(wx + 4, wy + 10);
                ctx.lineTo(wx + 13, wy - 2);
                ctx.lineTo(wx + 22, wy + 10);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(wx + W - 22, wy + 10);
                ctx.lineTo(wx + W - 13, wy - 2);
                ctx.lineTo(wx + W - 4, wy + 10);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#502838';
                ctx.fillRect(wx + W / 2 - 6, wy + H - 20, 12, 14);
                ctx.beginPath();
                ctx.arc(wx + W / 2, wy + H - 20, 6, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#ffd040';
                ctx.fillRect(wx + 11, wy + 20, 4, 4);
                ctx.fillRect(wx + W - 15, wy + 20, 4, 4);
            }
        }
        // sparkle to mark it as special
        if (Math.floor(t * 2) % 3 === 0)
        {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(wx + 6, wy + 5, 2, 2);
            ctx.fillRect(wx + W - 8, wy + 9, 2, 2);
        }
        return;
    }
    if (o.type === 'special2')
    {
        // 1x1 request-reward landmark, themed per game
        if (THEME && THEME.id === 'aqua')
        {
            // striped lighthouse with a blinking light
            ctx.fillStyle = '#e8e8e0';
            ctx.fillRect(wx + 11, wy + 8, 10, 20);
            ctx.fillStyle = '#e05038';
            ctx.fillRect(wx + 11, wy + 11, 10, 4);
            ctx.fillRect(wx + 11, wy + 19, 10, 4);
            ctx.fillStyle = '#3a4a58';
            ctx.fillRect(wx + 9, wy + 26, 14, 3);
            ctx.fillRect(wx + 10, wy + 4, 12, 5);
            var lit = Math.floor(t * 2) % 2 === 0;
            ctx.fillStyle = lit ? '#ffe060' : '#907830';
            ctx.fillRect(wx + 13, wy + 5, 6, 3);
        }
        else
        {
            if (THEME && THEME.id === 'museum')
            {
                // stone obelisk
                ctx.fillStyle = '#b0a890';
                ctx.beginPath();
                ctx.moveTo(wx + 16, wy + 2);
                ctx.lineTo(wx + 21, wy + 26);
                ctx.lineTo(wx + 11, wy + 26);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#948c74';
                ctx.fillRect(wx + 9, wy + 26, 14, 3);
                ctx.fillStyle = 'rgba(60,50,30,0.5)';
                ctx.fillRect(wx + 15, wy + 10, 2, 2);
                ctx.fillRect(wx + 15, wy + 15, 2, 2);
                ctx.fillRect(wx + 15, wy + 20, 2, 2);
            }
            else
            {
                // giant wrapped scratching post
                ctx.fillStyle = '#d8b070';
                ctx.fillRect(wx + 12, wy + 6, 8, 20);
                ctx.fillStyle = 'rgba(120,80,40,0.5)';
                var sy3;
                for (sy3 = 0; sy3 < 5; sy3++)
                {
                    ctx.fillRect(wx + 12, wy + 8 + sy3 * 4, 8, 1);
                }
                ctx.fillStyle = '#a87038';
                ctx.fillRect(wx + 8, wy + 3, 16, 4);
                ctx.fillRect(wx + 9, wy + 26, 14, 3);
            }
        }
        return;
    }
    if (o.type === 'special3')
    {
        // upscale eatery: striped awning, warm windows, hanging sign
        ctx.fillStyle = '#f6ecd8';
        ctx.fillRect(wx + 3, wy + 11, W - 6, H - 15);
        ctx.fillStyle = 'rgba(60,40,20,0.18)';
        ctx.fillRect(wx + 3, wy + H - 8, W - 6, 4);
        ctx.strokeStyle = '#6a4a24';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx + 3, wy + 11, W - 6, H - 15);
        var awn = (THEME.id === 'aqua') ? '#3fa0c8' : ((THEME.id === 'museum') ? '#b06a30' : '#e08aa8');
        for (var s3 = 0; s3 < Math.floor((W - 4) / 8); s3++)
        {
            ctx.fillStyle = (s3 % 2 === 0) ? awn : '#fff6e8';
            ctx.fillRect(wx + 2 + s3 * 8, wy + 4, 8, 8);
        }
        ctx.strokeStyle = '#6a4a24';
        ctx.strokeRect(wx + 2, wy + 4, W - 4, 8);
        // warm windows
        ctx.fillStyle = '#ffd88a';
        ctx.fillRect(wx + 8, wy + 15, 9, 7);
        ctx.fillRect(wx + W - 17, wy + 15, 9, 7);
        ctx.fillStyle = '#6a4a24';
        ctx.fillRect(wx + W / 2 - 3, wy + 15, 6, H - 20);
        // sparkle: it is a reward building
        if (Math.floor(t * 2) % 3 === 0)
        {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(wx + 5, wy + 6, 2, 2);
        }
        return;
    }
    if (o.type === 'special4')
    {
        // 3x3 landmark: ferris wheel (aqua/cat) or observatory dome (museum)
        var cxr = wx + W / 2;
        var cyr = wy + H / 2;
        if (THEME.id === 'museum')
        {
            // observatory dome with a telescope slit
            ctx.fillStyle = '#8c93a0';
            ctx.fillRect(wx + 8, wy + H - 22, W - 16, 18);
            ctx.fillStyle = '#c3c9d4';
            ctx.beginPath();
            ctx.arc(cxr, wy + H - 22, (W - 16) / 2, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#2a3040';
            ctx.fillRect(cxr - 4, wy + H - 40, 8, 20);
            ctx.fillStyle = '#e8eef6';
            ctx.fillRect(cxr - 2, wy + H - 38, 4, 16);
            ctx.fillStyle = '#ffd040';
            var tw = Math.floor(t * 2) % 2 === 0;
            ctx.fillRect(cxr - 1, wy + 6, 3, 3);
            if (tw)
            {
                ctx.fillRect(wx + 14, wy + 12, 2, 2);
                ctx.fillRect(wx + W - 16, wy + 16, 2, 2);
            }
        }
        else
        {
            // ferris wheel: rotating rim with cabins
            var rad = Math.min(W, H) / 2 - 8;
            ctx.strokeStyle = '#8894a4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cxr, cyr - 4, rad, 0, Math.PI * 2);
            ctx.stroke();
            var spin = t * 0.5;
            var cabs = ['#ff6a7a', '#ffd040', '#5ac8f0', '#7ad07a', '#c890f0', '#ffa040'];
            for (var cb = 0; cb < 6; cb++)
            {
                var ang = spin + cb * Math.PI / 3;
                var ccx = cxr + Math.cos(ang) * rad;
                var ccy = cyr - 4 + Math.sin(ang) * rad;
                ctx.strokeStyle = 'rgba(136,148,164,0.8)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(cxr, cyr - 4);
                ctx.lineTo(ccx, ccy);
                ctx.stroke();
                ctx.fillStyle = cabs[cb];
                ctx.fillRect(ccx - 4, ccy - 3, 8, 7);
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillRect(ccx - 2, ccy - 1, 4, 2);
            }
            // hub and legs
            ctx.fillStyle = '#6a7686';
            ctx.beginPath();
            ctx.arc(cxr, cyr - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#6a7686';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cxr, cyr - 4);
            ctx.lineTo(cxr - 12, wy + H - 6);
            ctx.moveTo(cxr, cyr - 4);
            ctx.lineTo(cxr + 12, wy + H - 6);
            ctx.stroke();
            ctx.fillStyle = '#8a5a28';
            ctx.fillRect(wx + 8, wy + H - 8, W - 16, 4);
        }
        return;
    }
    if (b.stage)
    {
        // show pool with stage platform
        ctx.fillStyle = '#38566a';
        roundRect(ctx, wx + 2, wy + 2, W - 4, H - 4, 6);
        ctx.fill();
        var g2 = ctx.createLinearGradient(0, wy + 6, 0, wy + H - 6);
        g2.addColorStop(0, '#7fd4ef');
        g2.addColorStop(1, '#2f8fc0');
        ctx.fillStyle = g2;
        ctx.fillRect(wx + 6, wy + 6, W - 12, H - 12);
        // stage platform at the left
        ctx.fillStyle = '#e8b060';
        ctx.fillRect(wx + 6, wy + H - 18, 22, 12);
        ctx.fillStyle = '#c88a38';
        ctx.fillRect(wx + 6, wy + H - 8, 22, 2);
        // flag garland
        var cols2 = ['#ff5070', '#ffd040', '#40c0f0', '#70d070'];
        for (var fl = 0; fl < Math.floor((W - 12) / 12); fl++)
        {
            ctx.fillStyle = cols2[fl % cols2.length];
            ctx.beginPath();
            ctx.moveTo(wx + 8 + fl * 12, wy + 4);
            ctx.lineTo(wx + 18 + fl * 12, wy + 4);
            ctx.lineTo(wx + 13 + fl * 12, wy + 11);
            ctx.closePath();
            ctx.fill();
        }
        // waves
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        for (var wv = 0; wv < 3; wv++)
        {
            var phw = (t * 22 + wv * 23) % (W - 20);
            ctx.fillRect(wx + 8 + phw, wy + 12 + wv * 9, 7, 2);
        }
        // performer arcs over the pool during a show
        if (typeof SHOW !== 'undefined' && SHOW && SHOW.objId === o.id)
        {
            var sp2 = SPECIES[SHOW.sp];
            var prog = (1 - SHOW.t / 6);
            var hop = (prog * 3) % 1;
            var jx = wx + 12 + hop * (W - 44);
            var jy = wy + H - 26 - Math.sin(hop * Math.PI) * (H - 18);
            drawCreature(ctx, sp2, jx, jy, 2, false, 0);
            // splash sparkles
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(jx + 4, wy + H - 14, 2, 2);
            ctx.fillRect(jx + 10, wy + H - 12, 2, 2);
        }
        else
        {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('공연장', wx + W / 2, wy + H / 2 + 3);
            ctx.textAlign = 'left';
        }
        return;
    }

    // generic kiosk (snack, ice, cafe, gift, toilet)
    var fc = FAC_COLORS[o.type] || { roof: '#909090', wall: '#e8e8e8' };
    ctx.fillStyle = fc.wall;
    ctx.fillRect(wx + 3, wy + 10, W - 6, H - 14);
    // depth strip along the base for a 3d feel
    ctx.fillStyle = 'rgba(60,40,20,0.18)';
    ctx.fillRect(wx + 3, wy + H - 8, W - 6, 4);
    ctx.strokeStyle = '#5a4020';
    ctx.lineWidth = 2;
    ctx.strokeRect(wx + 3, wy + 10, W - 6, H - 14);
    // striped awning
    for (var s = 0; s < Math.floor((W - 4) / 8); s++)
    {
        ctx.fillStyle = (s % 2 === 0) ? fc.roof : '#ffffff';
        ctx.fillRect(wx + 2 + s * 8, wy + 3, 8, 8);
    }
    ctx.strokeStyle = '#5a4020';
    ctx.strokeRect(wx + 2, wy + 3, W - 4, 8);
    // icon on the front
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a3010';
    var icon = { snack: '🍔', ice: '🍦', cafe: '☕', gift: '🎁', toilet: 'WC' }[o.type] || '';
    ctx.fillText(icon, wx + W / 2, wy + H - 8);
    ctx.textAlign = 'left';
}

function drawObject(ctx, o, t)
{
    var b = BUILD[o.type];
    var rotated = o.rot && b.w !== b.h;
    if (rotated)
    {
        // rotate the canvas 90 degrees around the rotated footprint center
        // and draw the native sprite centered; keeps all sprite code intact
        var nw = b.w * TS;
        var nh = b.h * TS;
        var rw = b.h * TS;
        var rh = b.w * TS;
        var cx = o.x * TS + rw / 2;
        var cy = o.y * TS + rh / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.PI / 2);
        var ox = -nw / 2;
        var oy = -nh / 2;
        ctx.fillStyle = 'rgba(60,40,20,0.15)';
        ctx.fillRect(ox + 2, oy + nh - 5, nw - 4, 4);
        if (b.kind === 'tank')
        {
            drawTank(ctx, o, ox, oy, t);
        }
        else
        {
            drawFacility(ctx, o, ox, oy, t);
        }
        ctx.restore();
        return;
    }
    var wx = o.x * TS;
    var wy = o.y * TS;
    // ground shadow
    ctx.fillStyle = 'rgba(60,40,20,0.15)';
    ctx.fillRect(wx + 2, wy + b.h * TS - 5, b.w * TS - 4, 4);
    if (b.kind === 'tank')
    {
        drawTank(ctx, o, wx, wy, t);
    }
    else
    {
        drawFacility(ctx, o, wx, wy, t);
    }
}

// ---------- emotes ----------
function drawEmote(ctx, kind, x, y)
{
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    var map = {
        heart: '💗', coin: '💰', rp: '🔬', angry: '💢',
        hunger: '🍔', thirst: '🥤', toilet: '🚻', energy: '💤',
        camera: '📸', note: '🎵', sparkle: '✨'
    };
    ctx.fillText(map[kind] || '♥', x, y);
    ctx.textAlign = 'left';
}

// ---------- icons for UI cards ----------
var iconCache = {};

function iconForBuild(type)
{
    var key = THEME.id + '_b_' + type;
    if (iconCache[key])
    {
        return iconCache[key];
    }
    var b = BUILD[type];
    var cw = b.w * TS;
    var chh = b.h * TS;
    var cv = document.createElement('canvas');
    cv.width = cw;
    cv.height = chh;
    var c = cv.getContext('2d');
    c.fillStyle = '#dff2fb';
    c.fillRect(0, 0, cw, chh);
    var fake = { type: type, x: 0, y: 0, species: null, lv: 1 };
    if (b.kind === 'tank')
    {
        drawTank(c, fake, 0, 0, 1.3);
    }
    else
    {
        drawFacility(c, fake, 0, 0, 1.3);
    }
    var url = cv.toDataURL();
    iconCache[key] = url;
    return url;
}

function iconForFloor(id)
{
    var key = 'f_' + THEME.id + '_' + id;
    if (iconCache[key])
    {
        return iconCache[key];
    }
    var cv2 = document.createElement('canvas');
    cv2.width = 44;
    cv2.height = 44;
    var c = cv2.getContext('2d');
    c.fillStyle = '#e8e2d4';
    c.fillRect(0, 0, 44, 44);
    if (id === 'erase')
    {
        c.fillStyle = '#f0f0f0';
        c.fillRect(8, 8, 28, 28);
        c.strokeStyle = '#c04030';
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(12, 12);
        c.lineTo(32, 32);
        c.moveTo(32, 12);
        c.lineTo(12, 32);
        c.stroke();
    }
    else
    {
        c.save();
        c.translate(6, 6);
        c.scale(32 / TS, 32 / TS);
        drawFloorTile(c, id, 0, 0);
        c.restore();
    }
    var url = cv2.toDataURL();
    iconCache[key] = url;
    return url;
}

function iconForSpecies(id)
{
    var key = THEME.id + '_s_' + id;
    if (iconCache[key])
    {
        return iconCache[key];
    }
    var sp = SPECIES[id];
    var rows = SHAPES[sp.shape];
    var cv = document.createElement('canvas');
    cv.width = 44;
    cv.height = 44;
    var c = cv.getContext('2d');
    c.fillStyle = '#bfe8f8';
    c.fillRect(0, 0, 44, 44);
    var px = Math.max(1, Math.min(Math.floor(40 / rows[0].length), Math.floor(40 / rows.length)));
    var ox = Math.floor((44 - rows[0].length * px) / 2);
    var oy = Math.floor((44 - rows.length * px) / 2);
    drawCreature(c, sp, ox, oy, px, false, 0);
    var url = cv.toDataURL();
    iconCache[key] = url;
    return url;
}


// Aquarium Story - core game state and simulation
// All comments ASCII only.

var S = null;               // persistent game state
var VISITORS = [];          // runtime visitors
var FLOATS = [];            // floating texts {x,y,text,color,t}
var EMOTES = [];            // emotes {x,y,kind,t}
var PAUSED = false;         // set true while modal open
var GAME_TIME = 0;          // seconds, for animation
var objIdSeq = 1;

function defaultState()
{
    var st = THEME.starter;
    var lv = {};
    lv[st] = 1;
    return {
        ver: 1,
        year: 1,
        month: 4,
        day: 1,

        rp: 30,

        spLv: lv,
        combosDone: [],
        visTotal: 0,
        mon: { vis: 0, feeIn: 0, shopIn: 0, maint: 0 },
        rank: 50,
        rank1Done: false,
        bailouts: 0,
        groupBurst: 0,
        stormMonth: false,
        spawnAcc: 0,
        spawnCd: 0,
        opened: false,
        expedition: null,
        showCd: 0,
        specialEx: null,
        questIdx: 0,
        floorTiles: {},
        buffs: {},
        requests: [],
        reqSpecialDone: [],
        facUnlocked: [],
        reqTimer: 8,
        reqSeq: 1,
        jobsAnnounced: ['kid', 'boy', 'girl'],
